<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vestel | Sceleton Army | 8 Mile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background: #000;
            color: #fff;
        }

        /* Canvas 3D фон */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Падающие лепестки сакуры */
        .sakura-petal {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 1.5rem;
            opacity: 0.7;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Главный контент */
        .main-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Неоновая карточка */
        .neon-card {
            max-width: 550px;
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            border: 1px solid rgba(255, 105, 180, 0.5);
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            padding: 40px 30px;
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Аватарка с неоном */
        .avatar-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff69b4;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.8), 0 0 60px rgba(255, 105, 180, 0.4);
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 105, 180, 0.6), 0 0 40px rgba(255, 105, 180, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 105, 180, 1), 0 0 80px rgba(255, 105, 180, 0.6); }
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Имя с градиентом */
        .name {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #ff69b4, #ff99cc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .nick {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ff99cc;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
            margin-bottom: 20px;
        }

        .age {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 105, 180, 0.15);
            border-radius: 100px;
            padding: 8px 20px;
            font-size: 1rem;
            color: #ffb7c5;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 105, 180, 0.4);
            backdrop-filter: blur(5px);
        }

        .bio {
            font-size: 1rem;
            color: #e0e0e0;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 30px;
            padding: 15px 20px;
            border-left: 3px solid #ff69b4;
            text-align: center;
            font-weight: 500;
        }

        /* Музыкальный плеер с визуализацией */
        .music-player {
            background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(30,10,20,0.7));
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 105, 180, 0.4);
            backdrop-filter: blur(10px);
        }

        .track-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .track-name {
            font-weight: 700;
            color: #ff99cc;
            text-shadow: 0 0 5px #ff69b4;
        }

        .time-display {
            font-family: monospace;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Визуализация музыки */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin-bottom: 15px;
        }

        .visualizer-bar {
            width: 4px;
            height: 20px;
            background: #ff69b4;
            border-radius: 2px;
            transition: height 0.05s ease;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .play-btn {
            background: linear-gradient(135deg, #ff69b4, #ff3388);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            color: white;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.8);
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #ff99cc);
            border-radius: 5px;
            transition: width 0.1s linear;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            justify-content: flex-end;
        }

        .volume-icon {
            font-size: 0.8rem;
            color: #ff99cc;
            cursor: pointer;
        }

        .volume-slider {
            width: 80px;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff69b4;
            cursor: pointer;
            box-shadow: 0 0 5px #ff69b4;
        }

        /* Кнопки соцсетей */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 60px;
            padding: 14px 20px;
            text-decoration: none;
            color: #f0f0f0;
            font-weight: 600;
            transition: all 0.25s;
            font-size: 1rem;
        }

        .link-btn:hover {
            background: rgba(255, 105, 180, 0.2);
            border-color: #ff69b4;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
        }

        .sakura-icon {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 1.3rem;
            color: #ff80b3;
            margin-top: 10px;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #888;
            border-top: 1px dashed rgba(255,105,180,0.3);
            padding-top: 15px;
        }

        .petal-trigger {
            background: none;
            border: none;
            cursor: pointer;
            color: #ff99cc;
            margin-left: 5px;
        }

        @media (max-width: 480px) {
            .neon-card {
                padding: 25px 20px;
            }
            .name {
                font-size: 2.2rem;
            }
            .avatar-wrapper {
                width: 100px;
                height: 100px;
            }
            .avatar {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="main-content">
    <div class="neon-card">
        <div class="avatar-wrapper">
            <div class="avatar">
                <img src="https://media.discordapp.net/attachments/1498720837694525580/1503369701840126102/5064BD7E-D3CE-4EAA-824B-103E9FF890CE.png?ex=6a0319a4&is=6a01c824&hm=b0fd716490103bde51d7aec9d4350081b0020b546f97509a1d9e23e2732bff01&=&format=webp&quality=lossless&width=925&height=960" alt="avatar">

<audio id="audioPlayer" preload="auto" autoplay loop>
    <source src="https://cdn.discordapp.com/attachments/1498720837694525580/1503395527969079387/madk1d_VILLIAN_-_8_.mp3?ex=6a0331b1&is=6a01e031&hm=8d0a75dba1338dd597c1d064a05f6500c14210a039d5ec9eb8cf433632c7d8d5&" type="audio/mpeg">
</audio>

<!-- Three.js библиотека для 3D фона -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- 3D ФОН С ЧАСТИЦАМИ ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    
    // Частицы (звёзды/сакура)
    const particleCount = 2000;
    const particlesGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    
    for (let i = 0; i < particleCount; i++) {
        positions[i*3] = (Math.random() - 0.5) * 200;
        positions[i*3+1] = (Math.random() - 0.5) * 100;
        positions[i*3+2] = (Math.random() - 0.5) * 80 - 30;
        
        const color = new THREE.Color().setHSL(0.95 + Math.random() * 0.1, 1, 0.6);
        colors[i*3] = color.r;
        colors[i*3+1] = color.g;
        colors[i*3+2] = color.b;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    
    const particleMaterial = new THREE.PointsMaterial({ size: 0.2, vertexColors: true, transparent: true, opacity: 0.8 });
    const particles = new THREE.Points(particlesGeometry, particleMaterial);
    scene.add(particles);
    
    // Вращающийся тор (неон)
    const torusGeometry = new THREE.TorusGeometry(5, 0.3, 64, 200);
    const torusMaterial = new THREE.MeshStandardMaterial({ color: 0xff69b4, emissive: 0xff3388, emissiveIntensity: 0.5 });
    const torus = new THREE.Mesh(torusGeometry, torusMaterial);
    scene.add(torus);
    
    // Маленькие сферы вокруг
    const sphereGroup = new THREE.Group();
    for (let i = 0; i < 30; i++) {
        const sphereGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff69b4, emissive: 0xff3388, emissiveIntensity: 0.3 });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        const angle = (i / 30) * Math.PI * 2;
        const radius = 7;
        sphere.position.x = Math.cos(angle) * radius;
        sphere.position.z = Math.sin(angle) * radius;
        sphere.position.y = Math.sin(angle * 2) * 2;
        sphereGroup.add(sphere);
    }
    scene.add(sphereGroup);
    
    // Освещение
    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xff69b4, 1, 50);
    pointLight.position.set(5, 5, 10);
    scene.add(pointLight);
    const pointLight2 = new THREE.PointLight(0xffffff, 0.5);
    pointLight2.position.set(-5, 3, 8);
    scene.add(pointLight2);
    
    // Анимация
    let time = 0;
    function animate3D() {
        requestAnimationFrame(animate3D);
        time += 0.01;
        
        particles.rotation.y = time * 0.05;
        particles.rotation.x = Math.sin(time * 0.1) * 0.1;
        
        torus.rotation.x = time * 0.5;
        torus.rotation.y = time * 0.3;
        
        sphereGroup.rotation.y = time * 0.2;
        sphereGroup.rotation.x = Math.sin(time * 0.3) * 0.2;
        
        camera.position.x = Math.sin(time * 0.1) * 2;
        camera.position.y = Math.cos(time * 0.15) * 1;
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
    }
    
    animate3D();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // --- ЛЕПЕСТКИ САКУРЫ ---
    const sakuraSymbols = ['🌸', '🌸', '🌸', '💮', '🌸', '✿', '❀', '🌸', '🌺', '🌸'];
    
    function createPetal() {
        const petal = document.createElement('div');
        petal.classList.add('sakura-petal');
        petal.innerHTML = sakuraSymbols[Math.floor(Math.random() * sakuraSymbols.length)];
        const size = 18 + Math.random() * 22;
        petal.style.fontSize = size + 'px';
        petal.style.left = Math.random() * 100 + '%';
        petal.style.animationDuration = 6 + Math.random() * 8 + 's';
        petal.style.animationDelay = Math.random() * 0.5 + 's';
        petal.style.opacity = 0.5 + Math.random() * 0.4;
        document.body.appendChild(petal);
        petal.addEventListener('animationend', () => petal.remove());
    }
    
    for (let i = 0; i < 20; i++) setTimeout(() => createPetal(), i * 150);
    setInterval(() => { if (Math.random() > 0.6) createPetal(); }, 3000);
    
    document.getElementById('addPetalsBtn')?.addEventListener('click', () => {
        for (let i = 0; i < 30; i++) setTimeout(() => createPetal(), i * 50);
    });
    
    // --- АУДИОПЛЕЕР С ВИЗУАЛИЗАЦИЕЙ ---
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeIcon = document.getElementById('volumeIcon');
    
    let isPlaying = true;
    let animationId = null;
    const bars = document.querySelectorAll('.visualizer-bar');
    
    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    
    function updateProgress() {
        if (audio.duration && !isNaN(audio.duration)) {
            progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
            timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        }
    }
    
    // Визуализация звука
    let audioContext = null;
    let source = null;
    let analyser = null;
    
    function setupAudioVisualization() {
        if (audioContext) return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        source = audioContext.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        function updateVisualizer() {
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            const step = Math.floor(dataArray.length / bars.length);
            for (let i = 0; i < bars.length; i++) {
                const value = dataArray[i * step] || 0;
                const height = 8 + (value / 255) * 40;
                bars[i].style.height = height + 'px';
            }
            requestAnimationFrame(updateVisualizer);
        }
        updateVisualizer();
    }
    
    audio.addEventListener('loadedmetadata', updateProgress);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('play', () => {
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
        }
        setupAudioVisualization();
    });
    
    playBtn.addEventListener('click', () => {
        if (isPlaying) {
            audio.pause();
            playBtn.textContent = '▶';
        } else {
            audio.play().then(() => {
                playBtn.textContent = '⏸';
                if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            }).catch(() => {});
        }
        isPlaying = !isPlaying;
    });
    
    progressBar.addEventListener('click', (e) => {
        if (audio.duration) {
            const rect = progressBar.getBoundingClientRect();
            audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        }
    });
    
    volumeSlider.addEventListener('input', (e) => {
        audio.volume = parseFloat(e.target.value);
        volumeIcon.textContent = audio.volume === 0 ? '🔇' : audio.volume < 0.5 ? '🔉' : '🔊';
    });
    
    volumeIcon.addEventListener('click', () => {
        if (audio.volume > 0) {
            audio.volume = 0;
            volumeSlider.value = 0;
            volumeIcon.textContent = '🔇';
        } else {
            audio.volume = 0.7;
            volumeSlider.value = 0.7;
            volumeIcon.textContent = '🔊';
        }
    });
    
    audio.volume = 0.7;
    
    // Автовоспроизведение
    function forceAutoPlay() {
        audio.play().then(() => {
            playBtn.textContent = '⏸';
            isPlaying = true;
            if (audioContext) audioContext.resume();
        }).catch(() => {
            setTimeout(forceAutoPlay, 1000);
        });
    }
    setTimeout(forceAutoPlay, 200);
    
    document.body.addEventListener('click', () => {
        if (audioContext && audioContext.state === 'suspended') audioContext.resume();
        if (!isPlaying) {
            audio.play().catch(() => {});
        }
    });
    
    // Параллакс эффект при движении мыши
    document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 20;
        const y = (e.clientY / window.innerHeight - 0.5) * 10;
        document.querySelector('.neon-card').style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
    });
</script>
</body>
</html>
