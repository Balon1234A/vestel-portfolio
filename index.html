<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>concrete wall</title>

<style>
body{
    margin:0;
    font-family:monospace;
    background:#0a0a0c;
    color:white;
    overflow:hidden;
}

/* ===== LANGUAGE SCREEN ===== */
.language-screen{
    position:fixed;
    inset:0;
    background:#050507;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.language-box{
    border:1px solid #444;
    padding:40px;
    text-align:center;
    background:#0c0c10;
}

.language-title{
    margin-bottom:20px;
    letter-spacing:3px;
}

.lang-btn{
    margin:10px;
    padding:15px 25px;
    background:#111;
    border:1px solid #666;
    color:white;
    cursor:pointer;
}

/* ===== TERMINAL ===== */
.terminal{
    display:none;
    padding:30px;
}

/* ===== MODAL ===== */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
}

.modal-content{
    background:#111;
    padding:25px;
    width:300px;
    border:1px solid #444;
}

.bio-item{
    margin:8px 0;
}

button{
    margin-top:10px;
    width:100%;
    padding:10px;
    background:#222;
    color:white;
    border:1px solid #555;
    cursor:pointer;
}

/* WORK HOURS */
#workHoursBox{
    display:none;
    margin-top:10px;
    padding:10px;
    border:1px solid #333;
}
</style>
</head>

<body>

<!-- LANGUAGE SCREEN -->
<div class="language-screen" id="langScreen">
    <div class="language-box">
        <div class="language-title">SELECT LANGUAGE</div>
        <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>
</div>

<!-- TERMINAL -->
<div class="terminal" id="terminal">

    <div>V + S = OPEN</div>
    <input id="input" placeholder="v+s">

</div>

<!-- MODAL -->
<div class="modal" id="modal">

    <div class="modal-content">

        <h3 id="title">IDENTITY</h3>

        <div class="bio-item"><span id="nameL">NAME</span>: Pasha</div>
        <div class="bio-item"><span id="ageL">AGE</span>: 17</div>
        <div class="bio-item"><span id="cityL">CITY</span>: Perm</div>
        <div class="bio-item"><span id="statusL">STATUS</span>: Offline</div>
        <div class="bio-item"><span id="workL">WORK</span>: Curator</div>

        <button onclick="toggleHours()" id="hoursBtn">WORK HOURS</button>

        <div id="workHoursBox">
            <div id="mon"></div>
            <div id="tue"></div>
            <div id="wed"></div>
            <div id="thu"></div>
            <div id="fri"></div>
            <div id="sat"></div>
            <div id="sun"></div>
        </div>

        <button onclick="closeModal()">CLOSE</button>
    </div>

</div>

<script>

let lang = "ru";

/* ===== TEXT DATA ===== */
const data = {
    ru:{
        title:"ЛИЧНОСТЬ",
        name:"ИМЯ",
        age:"ВОЗРАСТ",
        city:"ГОРОД",
        status:"СТАТУС",
        work:"РАБОТА",
        hours:"ЧАСЫ РАБОТЫ",
        close:"ЗАКРЫТЬ",
        schedule:[
            "Понедельник — 07:35 - 00:00",
            "Вторник — 07:35 - 00:00",
            "Среда — 07:35 - 00:00",
            "Четверг — 07:35 - 00:00",
            "Пятница — 07:35 - 00:00",
            "Суббота — 07:35 - 01:00",
            "Воскресенье — 11:00 - 00:00"
        ]
    },
    en:{
        title:"IDENTITY",
        name:"NAME",
        age:"AGE",
        city:"CITY",
        status:"STATUS",
        work:"WORK",
        hours:"WORK HOURS",
        close:"CLOSE",
        schedule:[
            "Monday — 07:35 - 00:00",
            "Tuesday — 07:35 - 00:00",
            "Wednesday — 07:35 - 00:00",
            "Thursday — 07:35 - 00:00",
            "Friday — 07:35 - 00:00",
            "Saturday — 07:35 - 01:00",
            "Sunday — 11:00 - 00:00"
        ]
    }
};

/* ===== LANGUAGE ===== */
function setLanguage(l){

    lang = l;

    document.getElementById("langScreen").style.display="none";
    document.getElementById("terminal").style.display="block";

    applyLang();
}

/* ===== APPLY TEXT ===== */
function applyLang(){

    const d = data[lang];

    document.getElementById("title").innerText = d.title;

    document.getElementById("nameL").innerText = d.name;
    document.getElementById("ageL").innerText = d.age;
    document.getElementById("cityL").innerText = d.city;
    document.getElementById("statusL").innerText = d.status;
    document.getElementById("workL").innerText = d.work;

    document.getElementById("hoursBtn").innerText = d.hours;
    document.querySelector("button[onclick='closeModal()']").innerText = d.close;

    const s = d.schedule;
    document.getElementById("mon").innerText = s[0];
    document.getElementById("tue").innerText = s[1];
    document.getElementById("wed").innerText = s[2];
    document.getElementById("thu").innerText = s[3];
    document.getElementById("fri").innerText = s[4];
    document.getElementById("sat").innerText = s[5];
    document.getElementById("sun").innerText = s[6];
}

/* ===== MODAL ===== */
function openModal(){
    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

/* ===== V + S ===== */
let v=false,s=false;

window.addEventListener("keydown",(e)=>{

    if(e.key=="v")v=true;
    if(e.key=="s")s=true;

    if(v&&s) openModal();
});

window.addEventListener("keyup",(e)=>{

    if(e.key=="v")v=false;
    if(e.key=="s")s=false;
});

/* INPUT */
document.getElementById("input").addEventListener("keydown",(e)=>{

    if(e.key==="Enter"){

        let val=e.target.value.toLowerCase();

        if(val==="v+s"||val==="vs") openModal();

        e.target.value="";
    }
});

/* WORK HOURS */
function toggleHours(){

    let box=document.getElementById("workHoursBox");

    box.style.display = box.style.display==="block"?"none":"block";
}

/* default */
applyLang();

</script>

</body>
</html>
