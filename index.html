<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vestel | Sceleton Army</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background: #0a0a0a;
            color: #fff;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent, rgba(0,0,0,0.4));
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Анимированная карточка */
        .epic-card {
            max-width: 560px;
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            border: 1px solid rgba(255, 105, 180, 0.6);
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.4), inset 0 0 30px rgba(255, 105, 180, 0.1);
            padding: 35px 30px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* Аватар с эффектом свечения */
        .avatar-section {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }

        .avatar-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ff69b4;
            opacity: 0.6;
            animation: pulse 2s infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .avatar {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff69b4;
            box-shadow: 0 0 30px #ff69b4;
            z-index: 1;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #ff69b4, #ff99cc, #ff69b4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 5px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,105,180,0.2);
            border-radius: 50px;
            padding: 5px 16px;
            font-size: 0.75rem;
            margin: 0 5px;
        }

        /* Статистика */
        .stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 30px;
            min-width: 80px;
        }

        .stat-number {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ff69b4;
        }

        /* Социальные кнопки */
        .social-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .social-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,105,180,0.3);
            border-radius: 50px;
            padding: 12px 25px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .social-btn:hover {
            background: #ff69b4;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,105,180,0.4);
        }

        .social-btn a {
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Кнопка INFO */
        .info-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,105,180,0.3);
            border-radius: 50px;
            padding: 12px 25px;
            color: white;
            font-weight: 500;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        .info-btn:hover {
            background: #ff69b4;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,105,180,0.4);
        }

        /* МОДАЛЬНОЕ ОКНО (поверх всего) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            background: linear-gradient(135deg, #1a1a2e, #0d0d1a);
            border-radius: 40px;
            padding: 35px 30px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            border: 2px solid #ff69b4;
            box-shadow: 0 0 50px rgba(255,105,180,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-window {
            transform: scale(1);
        }

        .modal-window h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff69b4, #ff99cc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .modal-info {
            text-align: left;
            margin: 20px 0;
            font-size: 1.1rem;
            line-height: 2;
        }

        .modal-info i {
            width: 30px;
            color: #ff69b4;
            margin-right: 10px;
        }

        .modal-close {
            background: linear-gradient(135deg, #ff69b4, #ff3388);
            border: none;
            border-radius: 40px;
            padding: 12px 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
            font-size: 1rem;
        }

        .modal-close:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff69b4;
        }

        /* Уведомление о копировании */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff69b4, #ff3388);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 10001;
            box-shadow: 0 0 20px rgba(255,105,180,0.5);
            animation: toastFade 2s ease forwards;
            pointer-events: none;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* Нижняя панель упрощённая */
        .footer-stuff {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: #aaa;
            border-top: 1px dashed rgba(255,105,180,0.3);
            padding-top: 18px;
            gap: 15px;
        }

        @media (max-width: 550px) {
            .epic-card { padding: 25px 20px; }
            .name { font-size: 2.2rem; }
            .avatar-section { width: 110px; height: 110px; }
            .avatar { width: 110px; height: 110px; }
            .stats { gap: 12px; }
            .stat-item { padding: 6px 12px; min-width: 70px; }
            .stat-number { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="overlay"></div>

<div class="main-container">
    <div class="epic-card" id="mainCard">
        <!-- Аватарка -->
        <div class="avatar-section">
            <div class="avatar-pulse"></div>
            <div class="avatar">
                <img src="https://media.discordapp.net/attachments/1498720837694525580/1503369701840126102/5064BD7E-D3CE-4EAA-824B-103E9FF890CE.png?ex=6a0319a4&is=6a01c824&hm=b0fd716490103bde51d7aec9d4350081b0020b546f97509a1d9e23e2732bff01&=&format=webp&quality=lossless&width=925&height=960" alt="avatar">
            </div>
        </div>

        <div class="name">Паша</div>
        <div style="margin-top: -5px; margin-bottom: 15px;">
            <span class="badge">@vestel</span>
            <span class="badge">🎂 17 лет</span>
            <span class="badge">💀 Sceleton Army</span>
        </div>

        <!-- Статистика -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="viewsCount">0</div>
                <div>👁️ просмотров</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="likesCount">0</div>
                <div class="like-btn" id="likeButton">❤️ лайк</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="clock">--:--</div>
                <div>🕒 время</div>
            </div>
        </div>

        <!-- Социальные сети -->
        <div class="social-links">
            <div class="social-btn" id="discordBtn">
                <i class="fab fa-discord"></i> vest_el
            </div>
            <a href="https://t.me/vest_ell" class="social-btn" target="_blank" id="telegramLink">
                <i class="fab fa-telegram"></i> @vest_ell
            </a>
        </div>

        <!-- Кнопка INFO -->
        <div class="info-btn" id="infoBtn">
            <i class="fas fa-info-circle"></i> INFO
        </div>

        <!-- Нижняя панель (упрощена) -->
        <div class="footer-stuff">
            <span>🌸 さくら</span>
            <span>💀 Sceleton Army</span>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО INFO -->
<div class="modal-overlay" id="infoModal">
    <div class="modal-window">
        <h2>🌸 INFO</h2>
        <div class="modal-info">
            <p><i class="fas fa-user"></i> <strong>Имя:</strong> Паша</p>
            <p><i class="fas fa-calendar-alt"></i> <strong>Возраст:</strong> 17 лет</p>
            <p><i class="fas fa-birthday-cake"></i> <strong>День рождения:</strong> 28 августа</p>
            <p><i class="fas fa-city"></i> <strong>Город:</strong> Пермь</p>
            <p><i class="fas fa-skull"></i> <strong>Должность:</strong> Sceleton Army - Curator, Support</p>
        </div>
        <button class="modal-close" id="closeModalBtn">✨ Закрыть ✨</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    (function() {
        // ========== МОДАЛЬНОЕ ОКНО ==========
        const modal = document.getElementById('infoModal');
        const infoBtn = document.getElementById('infoBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        function openModal() {
            modal.classList.add('active');
        }
        
        function closeModal() {
            modal.classList.remove('active');
        }
        
        if(infoBtn) infoBtn.addEventListener('click', openModal);
        if(closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
        
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });
        
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        // ========== УВЕДОМЛЕНИЕ ==========
        function showToast(message) {
            const existingToast = document.querySelector('.toast-notification');
            if(existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                if(toast && toast.remove) toast.remove();
            }, 2000);
        }

        // ========== КОПИРОВАНИЕ DISCORD НИКА ==========
        const discordBtn = document.getElementById('discordBtn');
        if(discordBtn) {
            discordBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const discordNick = 'vest_el';
                try {
                    await navigator.clipboard.writeText(discordNick);
                    showToast('✅ Discord скопирован: ' + discordNick);
                    discordBtn.style.transform = 'scale(0.95)';
                    setTimeout(() => { discordBtn.style.transform = ''; }, 150);
                } catch (err) {
                    showToast('❌ Не удалось скопировать');
                }
            });
        }

        // ========== ТРЕХМЕРНЫЙ ФОН ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 35);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // Частицы
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount; i++) {
            posArray[i*3] = (Math.random() - 0.5) * 200;
            posArray[i*3+1] = (Math.random() - 0.5) * 120;
            posArray[i*3+2] = (Math.random() - 0.5) * 100 - 30;
        }
        const particlesGeo = new THREE.BufferGeometry();
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ color: 0xff69b4, size: 0.18, transparent: true, opacity: 0.5 });
        const particleSystem = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleSystem);
        
        // Неоновые кольца
        const ringGeo = new THREE.TorusGeometry(6, 0.12, 64, 300);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xff69b4, emissive: 0xff3388, emissiveIntensity: 0.6 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        scene.add(ring);
        
        const ring2Geo = new THREE.TorusGeometry(8, 0.08, 64, 300);
        const ring2 = new THREE.Mesh(ring2Geo, ringMat);
        scene.add(ring2);
        
        // Плавающие сферы
        const sphereGroup = new THREE.Group();
        for(let i = 0; i < 50; i++) {
            const sphereGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff88bb, emissive: 0xff3388 });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            const angle = (i / 50) * Math.PI * 2;
            const rad = 5;
            sphere.position.set(Math.cos(angle) * rad, Math.sin(angle * 2) * 1.5, Math.sin(angle) * rad);
            sphereGroup.add(sphere);
        }
        scene.add(sphereGroup);
        
        const light1 = new THREE.PointLight(0xff69b4, 0.8);
        light1.position.set(5, 5, 10);
        scene.add(light1);
        const ambient = new THREE.AmbientLight(0x222222);
        scene.add(ambient);
        
        let time = 0;
        function animateBackground() {
            requestAnimationFrame(animateBackground);
            time += 0.008;
            particleSystem.rotation.y = time * 0.1;
            particleSystem.rotation.x = Math.sin(time * 0.2) * 0.1;
            ring.rotation.x = time * 0.3;
            ring.rotation.z = time * 0.2;
            ring2.rotation.y = time * 0.5;
            ring2.rotation.x = time * 0.2;
            sphereGroup.rotation.y = time * 0.2;
            sphereGroup.rotation.x = Math.sin(time * 0.5) * 0.2;
            
            camera.position.x = Math.sin(time * 0.2) * 1;
            camera.position.y = Math.cos(time * 0.25) * 0.8;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        animateBackground();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ========== ПАДАЮЩИЕ ЛЕПЕСТКИ САКУРЫ (автоматически) ==========
        const sakuraSymbols = ['🌸', '🌸', '💮', '🌸', '🌸', '✿', '❀', '🌸'];
        function createSakura() {
            const petal = document.createElement('div');
            petal.innerHTML = sakuraSymbols[Math.floor(Math.random() * sakuraSymbols.length)];
            petal.style.position = 'fixed';
            petal.style.pointerEvents = 'none';
            petal.style.zIndex = '9999';
            petal.style.fontSize = (18 + Math.random() * 20) + 'px';
            petal.style.left = Math.random() * 100 + '%';
            petal.style.top = '-50px';
            petal.style.opacity = 0.7;
            petal.style.animation = `fall ${5 + Math.random() * 6}s linear forwards`;
            document.body.appendChild(petal);
            petal.addEventListener('animationend', () => petal.remove());
        }
        const style = document.createElement('style');
        style.textContent = `@keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }`;
        document.head.appendChild(style);
        
        // Запускаем лепестки автоматически каждые 2-3 секунды
        for(let i=0;i<12;i++) setTimeout(createSakura, i * 150);
        setInterval(() => {
            const count = Math.random() > 0.7 ? 2 : 1;
            for(let i = 0; i < count; i++) {
                setTimeout(createSakura, i * 100);
            }
        }, 2500);
        
        // ========== СЧЁТЧИКИ ==========
        // Просмотры: начальные 54
        let views = localStorage.getItem('views') ? parseInt(localStorage.getItem('views')) + 1 : 54;
        localStorage.setItem('views', views);
        document.getElementById('viewsCount').innerText = views;
        
        // Лайки: начальные 11, каждый может поставить только 1 лайк
        let likes = localStorage.getItem('likes') ? parseInt(localStorage.getItem('likes')) : 11;
        let hasLiked = localStorage.getItem('hasLiked') === 'true';
        
        document.getElementById('likesCount').innerText = likes;
        
        const likeButton = document.getElementById('likeButton');
        if(hasLiked) {
            likeButton.style.opacity = '0.5';
            likeButton.style.cursor = 'not-allowed';
            likeButton.innerHTML = '❤️ лайк поставлен';
        }
        
        likeButton.onclick = () => {
            if(hasLiked) {
                showToast('❌ Вы уже поставили лайк!');
                return;
            }
            likes++;
            hasLiked = true;
            document.getElementById('likesCount').innerText = likes;
            localStorage.setItem('likes', likes);
            localStorage.setItem('hasLiked', 'true');
            likeButton.style.opacity = '0.5';
            likeButton.style.cursor = 'not-allowed';
            likeButton.innerHTML = '❤️ лайк поставлен';
            likeButton.classList.add('liked');
            showToast('❤️ Спасибо за лайк!');
            setTimeout(() => likeButton.classList.remove('liked'), 300);
        };
        
        // ========== ЧАСЫ ==========
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // ========== ПАРАЛЛАКС ==========
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            document.getElementById('mainCard').style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
        });
    })();
</script>
</body>
</html>
