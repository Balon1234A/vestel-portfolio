<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000000;
            font-family: 'Courier New', 'Fira Code', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* грубый звёздный фон — белые точки на чистом чёрном */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0.7;
        }

        /* контент — грубый, без имён, только намёк */
        .brutal-center {
            position: relative;
            z-index: 10;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 2.5rem 4rem;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: none;
            box-shadow: none;
            min-width: 280px;
        }

        .prompt {
            font-size: 1.2rem;
            letter-spacing: 4px;
            font-weight: 400;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            font-family: 'Courier New', monospace;
        }

        .keys {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            background: #111;
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid #333;
            letter-spacing: 8px;
            font-family: monospace;
        }

        .keys span {
            color: #888;
            font-size: 1.4rem;
            margin: 0 4px;
        }

        /* абсолютно минималистичный модальный хардкор */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
        }

        .modal-content {
            background: #0a0a0a;
            width: 380px;
            max-width: 85%;
            border: 1px solid #2a2a2a;
            padding: 2rem 1.8rem;
            text-align: left;
            color: #dddddd;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .modal-content h2 {
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 1.8rem;
            color: #fff;
            border-left: 3px solid #555;
            padding-left: 14px;
            text-transform: uppercase;
        }

        .bio-line {
            font-size: 1rem;
            margin: 0.9rem 0;
            font-weight: 300;
            border-bottom: 1px dashed #222;
            padding-bottom: 6px;
        }

        .bio-line strong {
            color: #ffffff;
            font-weight: 500;
            width: 70px;
            display: inline-block;
            letter-spacing: 1px;
        }

        .close-btn {
            background: transparent;
            border: 1px solid #3a3a3a;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: 400;
            color: #aaa;
            cursor: pointer;
            margin-top: 1.8rem;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.15s;
            width: 100%;
        }

        .close-btn:hover {
            background: #1a1a1a;
            color: white;
            border-color: #666;
        }

        /* убираем всё лишнее */
        .sign {
            display: none;
        }

        /* грубые звёзды без мерцания, просто точки */
        @keyframes none {
            0%, 100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="stars" id="starfield"></div>

<div class="brutal-center">
    <div class="prompt">›› ACCESS ‹‹</div>
    <div class="keys">
        <span>[</span> V <span>]</span>&nbsp;&nbsp;+&nbsp;&nbsp;<span>[</span> S <span>]</span>
    </div>
</div>

<div id="bioModal" class="modal">
    <div class="modal-content">
        <h2>// BIO_DATA</h2>
        <div class="bio-line"><strong>NAME</strong> : PAŠA</div>
        <div class="bio-line"><strong>AGE</strong>  : 17</div>
        <div class="bio-line"><strong>CITY</strong> : PERM</div>
        <div class="bio-line"><strong>STATUS</strong> : ██████</div>
        <button class="close-btn" id="closeModalBtn">[ X ] ЗАКРЫТЬ</button>
    </div>
</div>

<script>
    // грубый чёрный фон + простые белые звёзды (без лишних эффектов)
    function createHardStars() {
        const container = document.getElementById('starfield');
        if (!container) return;
        const starCount = 300;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            const size = Math.random() * 2.2 + 0.6;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            
            // случайная яркость 0.3 - 1.0
            const opacity = Math.random() * 0.7 + 0.25;
            star.style.opacity = opacity;
            
            // без анимации, просто статика
            container.appendChild(star);
        }
        
        // несколько более ярких (но без мерцаний)
        for (let i = 0; i < 80; i++) {
            const brightStar = document.createElement('div');
            brightStar.classList.add('star');
            const s = Math.random() * 2 + 1.2;
            brightStar.style.width = s + 'px';
            brightStar.style.height = s + 'px';
            brightStar.style.left = Math.random() * 100 + '%';
            brightStar.style.top = Math.random() * 100 + '%';
            brightStar.style.opacity = Math.random() * 0.9 + 0.5;
            container.appendChild(brightStar);
        }
    }

    // логика V + S 
    let vDown = false;
    let sDown = false;
    let modalOpened = false;
    
    const modal = document.getElementById('bioModal');
    const closeBtn = document.getElementById('closeModalBtn');
    
    function openBrutalModal() {
        if (modalOpened) return;
        modalOpened = true;
        modal.style.display = 'flex';
        vDown = false;
        sDown = false;
    }
    
    function closeModal() {
        modal.style.display = 'none';
        modalOpened = false;
    }
    
    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (modalOpened) return;
        
        if (key === 'v') {
            vDown = true;
            e.preventDefault();
        }
        if (key === 's') {
            sDown = true;
            e.preventDefault();
        }
        
        if (vDown && sDown) {
            openBrutalModal();
        }
    });
    
    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'v') vDown = false;
        if (key === 's') sDown = false;
    });
    
    if (closeBtn) {
        closeBtn.addEventListener('click', closeModal);
    }
    
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });
    
    createHardStars();
</script>
</body>
</html>
