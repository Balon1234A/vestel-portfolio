<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vestel | Sceleton Army — Orbital Slime Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Space Grotesk', monospace;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        canvas#webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* НЕБОЛЬШОЙ ЖИДКИЙ ОБЪЕКТ ЗА КАРТОЧКОЙ — КРУЖИТ И НЕ ВЫХОДИТ ЗА РАМКИ */
        .orbital-slime {
            position: fixed;
            bottom: 50%;
            right: 50%;
            transform: translate(50%, 50%);
            width: 580px;
            height: 580px;
            z-index: 5;
            pointer-events: none;
            filter: blur(35px) brightness(1.2);
            opacity: 0.65;
            mix-blend-mode: screen;
            border-radius: 50%;
            animation: slimeOrbit 12s infinite alternate ease-in-out;
        }
        
        .slime-core {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 45%, #ff2e6e, #ff0a54, #c9184a, #800f2f);
            border-radius: 60% 40% 70% 30% / 45% 55% 45% 55%;
            box-shadow: 0 0 80px #ff1a5e, 0 0 140px #ff5e9e;
            animation: liquidMorph 6s infinite cubic-bezier(0.45, 0.05, 0.2, 0.99);
        }
        
        /* Вторая оболочка для дополнительного вращения */
        .slime-aura {
            position: absolute;
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
            background: radial-gradient(ellipse, #ff66cc, #ff2a6e);
            border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%;
            filter: blur(18px);
            animation: spinAura 8s infinite linear;
            opacity: 0.8;
        }
        
        @keyframes slimeOrbit {
            0% {
                transform: translate(50%, 50%) translateX(-15px) translateY(10px) rotate(0deg);
                width: 560px;
                height: 560px;
            }
            33% {
                transform: translate(50%, 50%) translateX(20px) translateY(-12px) rotate(4deg);
                width: 590px;
                height: 570px;
            }
            66% {
                transform: translate(50%, 50%) translateX(-10px) translateY(18px) rotate(-3deg);
                width: 575px;
                height: 585px;
            }
            100% {
                transform: translate(50%, 50%) translateX(8px) translateY(-8px) rotate(0deg);
                width: 565px;
                height: 565px;
            }
        }
        
        @keyframes liquidMorph {
            0% { border-radius: 60% 40% 70% 30% / 45% 55% 45% 55%; transform: scale(1) rotate(0deg); background-position: 0% 0%;}
            25% { border-radius: 45% 55% 50% 50% / 60% 40% 60% 40%; transform: scale(1.04) rotate(2deg); background-position: 20% 30%;}
            50% { border-radius: 70% 30% 45% 55% / 35% 65% 35% 65%; transform: scale(0.98) rotate(-2deg); background-position: 50% 20%;}
            75% { border-radius: 35% 65% 60% 40% / 70% 30% 70% 30%; transform: scale(1.02) rotate(1deg); background-position: 30% 50%;}
            100% { border-radius: 60% 40% 70% 30% / 45% 55% 45% 55%; transform: scale(1) rotate(0deg); background-position: 0% 0%;}
        }
        
        @keyframes spinAura {
            0% { transform: rotate(0deg); border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%;}
            100% { transform: rotate(360deg); border-radius: 60% 40% 45% 55% / 55% 50% 50% 45%;}
        }
        
        .overlay-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.65) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .glitch-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.2;
            background: repeating-linear-gradient(0deg, rgba(255,0,100,0.08) 0px, rgba(255,0,100,0.08) 2px, transparent 2px, transparent 6px);
            animation: glitchMove 0.2s infinite;
        }
        @keyframes glitchMove {
            0% { transform: translateY(0); opacity: 0.15; }
            100% { transform: translateY(4px); opacity: 0.3; }
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .browser-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 110;
            background: rgba(10, 5, 20, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 46, 110, 0.5);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .compact-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 46, 110, 0.15);
            padding: 5px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 46, 110, 0.5);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .compact-tab i { color: #ff2e6e; }

        .widget-area {
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            padding: 5px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 46, 110, 0.4);
        }
        .weather-widget, .birthday-widget {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .weather-widget i, .birthday-widget i { color: #ff2e6e; }
        .countdown-number {
            font-weight: 800;
            background: linear-gradient(135deg, #ff2e6e, #ffaa66);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .main-content {
            position: relative;
            z-index: 15;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
            padding-top: 75px;
        }

        .cyber-card {
            max-width: 520px;
            width: 100%;
            background: rgba(8, 8, 20, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            border-radius: 40px;
            border: 1px solid rgba(255, 46, 110, 0.6);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 30px rgba(255,46,110,0.3);
            padding: 40px 30px;
            transition: 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            animation: floatCard 4s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }
        /* Лёгкая внутренняя подсветка от слизи, но сама слизь снаружи */
        .cyber-card::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(ellipse at center, rgba(255,46,110,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        
        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .cyber-card:hover {
            border-color: #ff2e6e;
            box-shadow: 0 30px 55px rgba(0,0,0,0.6), 0 0 50px rgba(255,46,110,0.5);
        }

        .lang-wrap {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 20px;
        }
        .lang-btn {
            background: rgba(255,46,110,0.15);
            border: 1px solid rgba(255,46,110,0.5);
            border-radius: 30px;
            padding: 5px 16px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            color: #ff99bb;
        }
        .lang-btn.active {
            background: #ff2e6e;
            color: white;
            box-shadow: 0 0 12px #ff2e6e;
        }

        .avatar-cyber {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            z-index: 2;
        }
        .avatar-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff2e6e, #ff8a5c, #ff2e6e);
            animation: spinRing 3s linear infinite;
            filter: blur(8px);
        }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }
        .avatar-img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff2e6e;
            box-shadow: 0 0 30px #ff2e6e;
        }
        .avatar-img img { width: 100%; height: 100%; object-fit: cover; }

        .nick-glitch {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ff2e6e, #ff8a5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255,46,110,0.5);
            margin-bottom: 12px;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .badge-cyber {
            background: rgba(255,46,110,0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,46,110,0.5);
            border-radius: 50px;
            padding: 4px 18px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .bio-cyber {
            background: rgba(0,0,0,0.6);
            border-left: 4px solid #ff2e6e;
            border-radius: 20px;
            padding: 12px 18px;
            margin: 18px 0;
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .social-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .cyber-btn {
            background: rgba(10,10,20,0.8);
            border: 1.5px solid rgba(255,46,110,0.6);
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: white;
            backdrop-filter: blur(8px);
            font-size: 0.85rem;
        }
        .cyber-btn i { font-size: 1.2rem; color: #ff2e6e; }
        .cyber-btn:hover {
            background: #ff2e6e;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,46,110,0.5);
        }
        .cyber-btn:hover i { color: white; }
        .info-btn-full { width: 100%; justify-content: center; }

        /* АДМИНКА — ПРОЗРАЧНАЯ КНОПКА */
        .admin-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 38px;
            height: 38px;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border: 1px solid rgba(255,46,110,0.3);
            cursor: pointer;
            transition: 0.2s;
            opacity: 0.45;
        }
        .admin-trigger:hover { opacity: 1; background: rgba(255,46,110,0.3); border-color: #ff2e6e; transform: scale(1.05); }
        .admin-trigger i { color: #ff99bb; font-size: 1rem; }

        .admin-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            background: linear-gradient(145deg, #0f0f1f, #020208);
            border-radius: 40px;
            padding: 28px 30px;
            max-width: 460px;
            width: 90%;
            z-index: 10001;
            border: 1.5px solid rgba(255,46,110,0.7);
            opacity: 0;
            visibility: hidden;
            transition: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 40px rgba(255,46,110,0.2);
            backdrop-filter: blur(8px);
        }
        .admin-modal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(255,46,110,0.4);
        }
        .admin-header h3 { font-size: 1.3rem; background: linear-gradient(135deg, #ff2e6e, #ffaa66); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .admin-input {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            background: rgba(20,20,40,0.8);
            border: 1px solid rgba(255,46,110,0.5);
            border-radius: 50px;
            color: #fff;
            font-family: 'Space Grotesk', monospace;
            outline: none;
        }
        .admin-input:focus { border-color: #ff2e6e; box-shadow: 0 0 12px rgba(255,46,110,0.4); }
        .admin-btn {
            background: linear-gradient(95deg, #ff2e6e, #ff5e9e);
            border: none;
            padding: 12px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: 0.2s;
        }
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255,46,110,0.5); }
        .flex-btns { display: flex; gap: 12px; margin-top: 8px; }
        .flex-btns .admin-btn { margin-top: 0; }

        .info-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .info-modal.active { opacity: 1; visibility: visible; }
        .info-window {
            background: linear-gradient(145deg, #111122, #050510);
            border-radius: 50px;
            padding: 35px;
            max-width: 380px;
            width: 90%;
            border: 2px solid #ff2e6e;
            text-align: center;
        }
        .info-window h2 { font-size: 1.8rem; margin-bottom: 18px; background: linear-gradient(135deg, #ff2e6e, #ffaa66); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .info-row { text-align: left; margin: 12px 0; font-size: 0.9rem; }
        .info-row i { width: 28px; color: #ff2e6e; }
        .close-info { background: #ff2e6e; border: none; padding: 10px 22px; border-radius: 40px; color: white; font-weight: bold; margin-top: 18px; cursor: pointer; }
        .footer-cyber { display: flex; justify-content: space-between; margin-top: 20px; font-size: 0.65rem; color: #ff99bb; border-top: 1px dashed rgba(255,46,110,0.4); padding-top: 15px; }
        
        @media (max-width: 650px) {
            .browser-bar { padding: 6px 15px; }
            .widget-area { gap: 12px; padding: 4px 12px; }
            .cyber-card { padding: 25px 18px; }
            .nick-glitch { font-size: 1.5rem; }
            .avatar-cyber { width: 100px; height: 100px; }
            .orbital-slime { width: 480px; height: 480px; filter: blur(30px); opacity: 0.6; }
        }
    </style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>

<!-- АККУРАТНЫЙ ОРБИТАЛЬНЫЙ ОБЪЕКТ ЗА КАРТОЧКОЙ — РОЗОВАЯ ЖИДКАЯ СФЕРА, КРУЖИТСЯ КРАСИВО -->

<div class="overlay-gradient"></div>

<script type="module">
    import * as THREE from 'three';
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010105);
    scene.fog = new THREE.FogExp2(0x010105, 0.008);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 14);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    const ambientLight = new THREE.AmbientLight(0x111122);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xff5588, 1.2);
    mainLight.position.set(3,5,4);
    mainLight.castShadow = true;
    scene.add(mainLight);
    const backLight = new THREE.PointLight(0xff2e6e,0.8);
    backLight.position.set(-2,1.5,-5);
    scene.add(backLight);
    const fillLight = new THREE.PointLight(0x44aaff,0.5);
    fillLight.position.set(2,1,3);
    scene.add(fillLight);
    
    const mainOrbitalGroup = new THREE.Group();
    const coreGeo = new THREE.IcosahedronGeometry(0.85,0);
    const coreMat = new THREE.MeshStandardMaterial({ color:0xff2266, emissive:0xff1155, emissiveIntensity:0.8, metalness:0.85, roughness:0.2 });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    mainOrbitalGroup.add(coreMesh);
    const spikeGroup = new THREE.Group();
    const spikeMat = new THREE.MeshStandardMaterial({ color:0xff44aa, emissive:0xff2266, metalness:0.7 });
    for(let i=0;i<24;i++){ const spike=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.55,6),spikeMat); const angle=(i/24)*Math.PI*2; spike.position.set(Math.cos(angle)*1.25, Math.sin(angle)*0.8, Math.sin(angle)*1.25); spike.lookAt(0,0,0); spikeGroup.add(spike); }
    mainOrbitalGroup.add(spikeGroup);
    const ringMatGlow = new THREE.MeshStandardMaterial({ color:0xff2e6e, emissive:0xff2e6e, emissiveIntensity:0.7 });
    const outerRing = new THREE.Mesh(new THREE.TorusGeometry(1.65,0.08,64,200), ringMatGlow);
    outerRing.rotation.x = Math.PI/2; outerRing.rotation.z = Math.PI/4;
    mainOrbitalGroup.add(outerRing);
    const diagonalRing = new THREE.Mesh(new THREE.TorusGeometry(1.85,0.07,64,200), ringMatGlow);
    diagonalRing.rotation.y = Math.PI/3; diagonalRing.rotation.x = Math.PI/3;
    mainOrbitalGroup.add(diagonalRing);
    const crystalGroup = new THREE.Group();
    const crystalMat = new THREE.MeshStandardMaterial({ color:0xff66aa, emissive:0x882244, emissiveIntensity:0.6 });
    for(let i=0;i<12;i++){ const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(0.22),crystalMat); const angleRad=(i/12)*Math.PI*2; crystal.position.set(Math.cos(angleRad)*2.1, Math.sin(angleRad*2)*0.9, Math.sin(angleRad)*2.1); crystalGroup.add(crystal); }
    mainOrbitalGroup.add(crystalGroup);
    const vortexParticleCount=800, vortexPositions=[];
    const vortexGeo=new THREE.BufferGeometry();
    for(let i=0;i<vortexParticleCount;i++){ const r=2.0+Math.random()*1.2; const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1); vortexPositions.push(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta)*0.6, r*Math.cos(phi)); }
    vortexGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vortexPositions),3));
    const vortexPoints=new THREE.Points(vortexGeo, new THREE.PointsMaterial({color:0xff77bb, size:0.05, blending:THREE.AdditiveBlending}));
    mainOrbitalGroup.add(vortexPoints);
    scene.add(mainOrbitalGroup);
    
    const bgParticleCount=1500, bgPositions=[];
    for(let i=0;i<bgParticleCount;i++) bgPositions.push((Math.random()-0.5)*55,(Math.random()-0.5)*30,(Math.random()-0.5)*40-15);
    const bgParticleGeo=new THREE.BufferGeometry();
    bgParticleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bgPositions),3));
    const bgStars=new THREE.Points(bgParticleGeo, new THREE.PointsMaterial({color:0xff4d8c,size:0.05,transparent:true,opacity:0.3}));
    scene.add(bgStars);
    const auraLight=new THREE.PointLight(0xff2e6e,1.2,18);
    mainOrbitalGroup.add(auraLight);
    
    const characterGroup=new THREE.Group();
    const bodyChar=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.5,1.2,12), new THREE.MeshStandardMaterial({color:0xcc2266, emissive:0x331133, metalness:0.7}));
    bodyChar.position.y=0; characterGroup.add(bodyChar);
    const headChar=new THREE.Mesh(new THREE.SphereGeometry(0.48,32,32), new THREE.MeshStandardMaterial({color:0xdd44aa, emissive:0x441133, metalness:0.8}));
    headChar.position.y=0.85; characterGroup.add(headChar);
    const visorChar=new THREE.Mesh(new THREE.BoxGeometry(0.65,0.2,0.1), new THREE.MeshStandardMaterial({color:0xff2e6e, emissive:0xff2e6e, emissiveIntensity:1.2}));
    visorChar.position.set(0,0.9,0.48); characterGroup.add(visorChar);
    characterGroup.position.set(0,-0.95,-2.5); characterGroup.scale.set(0.85,0.85,0.85);
    scene.add(characterGroup);
    let time=0;
    function animate3D(){ requestAnimationFrame(animate3D); time+=0.012;
        mainOrbitalGroup.rotation.y=time*0.35; mainOrbitalGroup.rotation.x=Math.sin(time*0.2)*0.2; mainOrbitalGroup.rotation.z=Math.cos(time*0.25)*0.15;
        spikeGroup.rotation.y=time*0.8; spikeGroup.rotation.x=time*0.5; crystalGroup.rotation.y=-time*0.6; crystalGroup.rotation.z=time*0.4;
        const scaleRing=1+Math.sin(time*5)*0.03; outerRing.scale.set(scaleRing,scaleRing,scaleRing);
        vortexPoints.rotation.y=time*0.2; auraLight.intensity=1.0+Math.sin(time*2.5)*0.5;
        coreMesh.material.emissiveIntensity=0.6+Math.sin(time*3)*0.3;
        characterGroup.position.y=-0.95+Math.sin(time*1.5)*0.025; visorChar.material.emissiveIntensity=0.9+Math.sin(time*8)*0.6;
        bgStars.rotation.y=time*0.02; camera.position.x+=(Math.sin(time*0.15)*0.15-camera.position.x)*0.03; camera.position.y+=(1.6+Math.sin(time*0.25)*0.05-camera.position.y)*0.03; camera.lookAt(0,0.2,0);
        renderer.render(scene,camera);
    }
    animate3D();
    window.addEventListener('resize',()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
</script>
