<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vestel | Sceleton Army</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', 'Helvetica Neue', sans-serif;
            color: #f0f0f0;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* падающие лепестки сакуры */
        .sakura-petal {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 1.2rem;
            opacity: 0.7;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* главная карточка — черный матовый блок */
        .black-card {
            max-width: 500px;
            width: 100%;
            background: rgba(8, 8, 8, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(255, 105, 180, 0.35);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 105, 180, 0.15), 0 0 25px rgba(255, 105, 180, 0.25);
            text-align: center;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        /* свечение по краям */
        .black-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 48px;
            padding: 1px;
            background: radial-gradient(circle at 30% 20%, rgba(255, 140, 200, 0.5), transparent 80%);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            pointer-events: none;
        }

        /* БОЛЬШОЙ БАННЕР (шапка карточки) */
        .hero-banner {
            width: 100%;
            height: 160px;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* Контейнер для аватарки (накладываем поверх банера) */
        .avatar-wrapper {
            position: relative;
            margin-top: -55px;
            margin-bottom: 12px;
            z-index: 5;
        }

        /* АВАТАРКА (круглая, поверх банера) */
        .avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto;
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ff69b4;
            box-shadow: 0 0 18px rgba(255, 105, 180, 0.6);
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar span {
            font-size: 3rem;
            filter: drop-shadow(0 2px 6px rgba(255,105,180,0.5));
        }

        /* Контент под аватаркой */
        .content {
            padding: 0 28px 36px 28px;
        }

        .name {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #ffb6c1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }

        .nick {
            font-size: 1.15rem;
            font-weight: 500;
            color: #ff99cc;
            background: rgba(255, 105, 180, 0.12);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 60px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .age {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 20, 20, 0.7);
            border-radius: 100px;
            padding: 6px 18px;
            font-size: 0.9rem;
            color: #ffb7c5;
            margin-bottom: 28px;
            border: 0.5px solid rgba(255,105,180,0.4);
        }

        .bio {
            font-size: 1rem;
            color: #eaeaea;
            margin-bottom: 32px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            padding: 14px 18px;
            line-height: 1.5;
            border-left: 2px solid #ff69b4;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* СТИЛИ ДЛЯ АУДИОПЛЕЕРА */
        .music-player {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 60px;
            padding: 12px 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(8px);
        }

        .track-title {
            font-size: 0.8rem;
            color: #ff99cc;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-name {
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .time-display {
            font-family: monospace;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .play-btn {
            background: #ff69b4;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            color: #0a0a0a;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn:hover {
            transform: scale(1.05);
            background: #ff3388;
            box-shadow: 0 0 12px #ff69b4;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ff69b4;
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            justify-content: flex-end;
        }

        .volume-icon {
            font-size: 0.7rem;
            color: #ff99cc;
            cursor: pointer;
        }

        .volume-slider {
            width: 70px;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff69b4;
            cursor: pointer;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #2e2e2e;
            border-radius: 60px;
            padding: 12px 18px;
            text-decoration: none;
            color: #f0f0f0;
            font-weight: 500;
            transition: all 0.25s;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .link-btn i {
            font-size: 1.2rem;
            color: #ff99cc;
        }

        .link-btn:hover {
            background: rgba(255, 105, 180, 0.2);
            border-color: #ff69b4;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(255,105,180,0.2);
            color: white;
        }

        .sakura-icon {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ff80b3;
            opacity: 0.8;
        }

        .footer-note {
            margin-top: 32px;
            font-size: 0.7rem;
            color: #6a6a6a;
            letter-spacing: 0.3px;
            border-top: 1px dashed rgba(255,105,180,0.3);
            padding-top: 18px;
        }

        .petal-trigger {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            color: #ff99cc;
            margin-left: 6px;
            transition: 0.2s;
        }

        .petal-trigger:hover {
            color: #ff69b4;
            text-shadow: 0 0 4px #ff69b4;
        }

        @media (max-width: 480px) {
            .content {
                padding: 0 20px 28px 20px;
            }
            .name {
                font-size: 2rem;
            }
            .hero-banner {
                height: 130px;
            }
            .avatar-wrapper {
                margin-top: -45px;
            }
            .avatar {
                width: 85px;
                height: 85px;
            }
            .avatar span {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

<div class="black-card">
    <!-- БОЛЬШОЙ БАННЕР (шапка) -->
    <img class="hero-banner" 
         src="https://media.discordapp.net/attachments/1498720837694525580/1503383694960885872/transparent-Photoroom_1.png?ex=6a0326ac&is=6a01d52c&hm=f445c61c4495c69f2fa60e8f2fdd20c06d37413c07ed1582bf4d6910b9ff2d32&=&format=webp&quality=lossless&width=1712&height=856" 
         alt="banner"
         onerror="this.style.height='120px'; this.style.background='#1a1a2e';">

    <!-- АВАТАРКА (поверх банера) -->
    <div class="avatar-wrapper">
        <div class="avatar">
            <img src="https://media.discordapp.net/attachments/1498720837694525580/1503369701840126102/5064BD7E-D3CE-4EAA-824B-103E9FF890CE.png?ex=6a0319a4&is=6a01c824&hm=b0fd716490103bde51d7aec9d4350081b0020b546f97509a1d9e23e2732bff01&=&format=webp&quality=lossless&width=925&height=960" 
                 alt="avatar"
                 onerror="this.style.display='none'; this.parentElement.innerHTML='<span>💀🌸</span>'">
        </div>
    </div>

    <!-- ВЕСЬ КОНТЕНТ НИЖЕ -->
    <div class="content">
        <div class="name">Паша</div>
        <div class="nick">@vestel</div>
        <div class="age">
            <i>🌸</i> 17 лет
        </div>
        <div class="bio">
            Должности: Sceleton Army - Curator, Support
        </div>

        <!-- АУДИОПЛЕЕР С ТРЕКОМ "ВОСЬМАЯ МИЛЯ" -->
        <div class="music-player">
            <div class="track-title">
                <span class="track-name">🎵 Eminem - Lose Yourself (8 Mile)</span>
                <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            </div>
            <div class="player-controls">
                <button class="play-btn" id="playBtn">▶</button>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="volume-control">
                <span class="volume-icon" id="volumeIcon">🔊</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
            </div>
        </div>

        <div class="links">
            <a href="#" class="link-btn" target="_blank">
                🎮 Discord: vest_el
            </a>
            <a href="https://t.me/vest_ell" class="link-btn" target="_blank">
                📱 Telegram: @vest_ell
            </a>
        </div>
        <div class="sakura-icon">
            <span>🌸</span> <span>✦</span> <span>🌙</span> <span>🍃</span> <span>🌸</span>
        </div>
        <div class="footer-note">
            ✦ さくら & ブラック ✦ <button class="petal-trigger" id="addPetalsBtn">+ лепестки</button>
        </div>
    </div>
</div>

<audio id="audioPlayer" preload="auto">
    <!-- ⚠️ ЗАМЕНИ ЭТУ ССЫЛКУ НА РЕАЛЬНЫЙ MP3-ФАЙЛ ⚠️ -->
    <source src="https://cdn.discordapp.com/attachments/1498720837694525580/1503395527969079387/madk1d_VILLIAN_-_8_.mp3?ex=6a0331b1&is=6a01e031&hm=8d0a75dba1338dd597c1d064a05f6500c14210a039d5ec9eb8cf433632c7d8d5&" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<script>
    (function() {
        // ----- ЛЕПЕСТКИ САКУРЫ -----
        const sakuraSymbols = ['🌸', '🌸', '🌸', '💮', '🌸', '✿', '❀', '🌸', '🌺'];
        
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('sakura-petal');
            const randomIndex = Math.floor(Math.random() * sakuraSymbols.length);
            petal.innerHTML = sakuraSymbols[randomIndex];
            const size = 14 + Math.random() * 18;
            petal.style.fontSize = size + 'px';
            petal.style.left = Math.random() * 100 + '%';
            const duration = 5 + Math.random() * 7;
            petal.style.animationDuration = duration + 's';
            petal.style.animationDelay = Math.random() * 0.5 + 's';
            petal.style.opacity = 0.4 + Math.random() * 0.5;
            petal.style.filter = 'drop-shadow(0 0 2px rgba(255,105,180,0.4))';
            document.body.appendChild(petal);
            petal.addEventListener('animationend', function() {
                if (petal && petal.remove) petal.remove();
            });
        }
        
        function initPetals(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => createPetal(), i * 200);
            }
        }
        
        function burstPetals(amount) {
            let created = 0;
            const interval = setInterval(() => {
                if (created >= amount) {
                    clearInterval(interval);
                    return;
                }
                createPetal();
                created++;
            }, 60);
        }
        
        initPetals(12);
        
        setInterval(() => {
            const randomCount = Math.random() > 0.7 ? 2 : 1;
            for (let i = 0; i < randomCount; i++) {
                setTimeout(() => createPetal(), i * 100);
            }
        }, 6000);
        
        const btn = document.getElementById('addPetalsBtn');
        if (btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                burstPetals(22);
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => { btn.style.transform = ''; }, 150);
            });
        }
        
        document.body.addEventListener('mousemove', function(e) {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, #121212 0%, #030303 100%)`;
        });
        
        document.body.style.background = 'radial-gradient(circle at 30% 40%, #121212, #000000)';
        
        // ----- АУДИОПЛЕЕР -----
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        
        let isPlaying = false;
        
        // Форматирование времени (сек -> мм:сс)
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Обновление дисплея времени и прогресс-бара
        function updateProgress() {
            if (audio.duration && !isNaN(audio.duration)) {
                const current = audio.currentTime;
                const duration = audio.duration;
                const percent = (current / duration) * 100;
                progressFill.style.width = percent + '%';
                timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
            } else {
                timeDisplay.textContent = "0:00 / 0:00";
            }
        }
        
        // Когда метаданные загружены
        audio.addEventListener('loadedmetadata', () => {
            updateProgress();
            timeDisplay.textContent = `0:00 / ${formatTime(audio.duration)}`;
        });
        
        // Обновление во время воспроизведения
        audio.addEventListener('timeupdate', updateProgress);
        
        // Когда трек закончился
        audio.addEventListener('ended', () => {
            isPlaying = false;
            playBtn.textContent = '▶';
            progressFill.style.width = '0%';
            timeDisplay.textContent = `0:00 / ${formatTime(audio.duration)}`;
            audio.currentTime = 0;
        });
        
        // Play/Pause
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
            } else {
                // Пытаемся запустить (браузер может блокировать автозапуск)
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playBtn.textContent = '⏸';
                        isPlaying = true;
                    }).catch(() => {
                        // Автозапуск заблокирован — показываем кнопку
                        playBtn.textContent = '▶';
                        isPlaying = false;
                        alert('Нажмите Play ещё раз — браузер заблокировал автозапуск');
                    });
                }
            }
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = '⏸';
            } else {
                playBtn.textContent = '▶';
            }
        });
        
        // Клик по прогресс-бару
        progressBar.addEventListener('click', (e) => {
            if (audio.duration && !isNaN(audio.duration)) {
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
                updateProgress();
            }
        });
        
        // Громкость
        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            audio.volume = vol;
            if (vol === 0) {
                volumeIcon.textContent = '🔇';
            } else if (vol < 0.5) {
                volumeIcon.textContent = '🔉';
            } else {
                volumeIcon.textContent = '🔊';
            }
        });
        
        volumeIcon.addEventListener('click', () => {
            if (audio.volume > 0) {
                audio.volume = 0;
                volumeSlider.value = 0;
                volumeIcon.textContent = '🔇';
            } else {
                audio.volume = 0.7;
                volumeSlider.value = 0.7;
                volumeIcon.textContent = '🔊';
            }
        });
        
        // Установка начальной громкости
        audio.volume = 0.7;
        volumeSlider.value = 0.7;
        
        // Пытаемся запустить музыку при первом касании/клике по странице (обходит блокировку)
        function tryAutoPlay() {
            audio.play().then(() => {
                playBtn.textContent = '⏸';
                isPlaying = true;
                document.removeEventListener('click', tryAutoPlay);
                document.removeEventListener('touchstart', tryAutoPlay);
            }).catch(() => {});
        }
        
        document.addEventListener('click', tryAutoPlay);
        document.addEventListener('touchstart', tryAutoPlay);
    })();
</script>
</body>
</html>
