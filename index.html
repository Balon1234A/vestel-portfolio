<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unknown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000000;
            font-family: 'Courier New', 'Fira Code', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .terminal {
            position: relative;
            z-index: 10;
            width: 550px;
            max-width: 90vw;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #ff2a6d;
            padding: 2rem;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.15);
        }

        .prompt-line {
            color: #ff2a6d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            font-family: monospace;
            border-bottom: 1px solid #3a1030;
            padding-bottom: 0.7rem;
        }

        .prompt-line span {
            color: #ffffff;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: #ff2a6d;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .input-line {
            margin: 1.2rem 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: monospace;
        }

        .input-prefix {
            color: #ff2a6d;
            font-size: 1rem;
        }

        .input-field {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            outline: none;
            flex: 1;
            letter-spacing: 1px;
        }

        .input-field::placeholder {
            color: #331a2a;
            font-size: 0.8rem;
        }

        .hint-box {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #2a1020;
            text-align: center;
        }

        .key-combo {
            color: #aa5588;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .key-combo kbd {
            background: #110511;
            border: 1px solid #ff2a6d;
            padding: 4px 12px;
            margin: 0 4px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff2a6d;
            border-radius: 0;
            font-family: monospace;
        }

        .attempt-counter {
            font-size: 0.7rem;
            color: #552a44;
            margin-top: 10px;
        }

        .key-pressed {
            animation: keyFlash 0.1s ease-out;
        }

        @keyframes keyFlash {
            0% { background: #3a1030; color: #ff6a9d; border-color: #ff6a9d; transform: scale(1.05); }
            100% { background: #110511; color: #ff2a6d; border-color: #ff2a6d; transform: scale(1); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000ee;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: #0a0006;
            width: 400px;
            max-width: 85%;
            border: 1px solid #ff2a6d;
            padding: 2rem;
            text-align: left;
            color: #ddbbcc;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.2);
        }

        .modal-content h2 {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            color: #ff2a6d;
            border-left: 3px solid #ff2a6d;
            padding-left: 12px;
            text-transform: uppercase;
        }

        .bio-item {
            font-size: 0.95rem;
            margin: 0.8rem 0;
            border-bottom: 1px dashed #3a1030;
            padding-bottom: 6px;
        }

        .bio-item .label {
            color: #ff6a9d;
            display: inline-block;
            width: 70px;
            font-weight: bold;
        }

        .bio-item .value {
            color: #fff;
        }

        .close-modal-btn {
            background: transparent;
            border: 1px solid #ff2a6d;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: 400;
            color: #ff2a6d;
            cursor: pointer;
            margin-top: 1.5rem;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.2s;
            width: 100%;
        }

        .close-modal-btn:hover {
            background: #1a0512;
            border-color: #ff6a9d;
            color: #ff6a9d;
        }

        .matrix-line {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 5;
            font-size: 0.6rem;
            color: #3a1030;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            width: 300px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="stars" id="starfield"></div>

<div class="terminal">
    <div class="prompt-line">
        > user@unknown:~<span>$</span> <span id="blinkingText">ACCESS_GRANTED</span><span class="cursor"></span>
    </div>
    
    <div class="input-line">
        <span class="input-prefix">$></span>
        <input type="text" class="input-field" id="commandInput" placeholder="[ v+s ]" autocomplete="off">
    </div>
    
    <div class="hint-box">
        <div class="key-combo">
            [V] + [S]
        </div>
        <div class="attempt-counter" id="attemptText">[ ATTEMPTS: 0 ]</div>
    </div>
</div>

<div class="matrix-line" id="matrixText">01101101 01100001 01110100 01110010 01101001 01111000</div>

<div id="bioModal" class="modal">
    <div class="modal-content">
        <h2>IDENTITY</h2>
        <div class="bio-item"><span class="label">NAME</span><span class="value">: PASHA</span></div>
        <div class="bio-item"><span class="label">AGE</span><span class="value">: 17</span></div>
        <div class="bio-item"><span class="label">CITY</span><span class="value">: PERM</span></div>
        <div class="bio-item"><span class="label">STATUS</span><span class="value">: OFFLINE</span></div>
        <button class="close-modal-btn" id="closeModalBtn">CLOSE</button>
    </div>
</div>

<script>
    function createStars() {
        const container = document.getElementById('starfield');
        if (!container) return;
        const starCount = 400;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.2 + 0.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.opacity = Math.random() * 0.8 + 0.2;
            container.appendChild(star);
        }
        for (let i = 0; i < 100; i++) {
            const bright = document.createElement('div');
            bright.classList.add('star');
            bright.style.width = (Math.random() * 2.5 + 1.2) + 'px';
            bright.style.height = bright.style.width;
            bright.style.left = Math.random() * 100 + '%';
            bright.style.top = Math.random() * 100 + '%';
            bright.style.opacity = Math.random() * 0.9 + 0.5;
            container.appendChild(bright);
        }
    }

    let vKeyHeld = false;
    let sKeyHeld = false;
    let modalActive = false;
    let attemptCount = 0;
    const attemptSpan = document.getElementById('attemptText');
    const modal = document.getElementById('bioModal');
    const closeBtn = document.getElementById('closeModalBtn');
    const commandInput = document.getElementById('commandInput');

    function updateAttempts() {
        if (attemptSpan) attemptSpan.innerText = '[ ATTEMPTS: ' + attemptCount + ' ]';
    }

    function flashKey(element) {
        if (!element) return;
        element.classList.add('key-pressed');
        setTimeout(() => {
            element.classList.remove('key-pressed');
        }, 120);
    }

    function openModal() {
        if (modalActive) return;
        modalActive = true;
        modal.style.display = 'flex';
        vKeyHeld = false;
        sKeyHeld = false;
        attemptCount++;
        updateAttempts();
    }

    function closeModalFunc() {
        modal.style.display = 'none';
        modalActive = false;
    }

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        
        if (modalActive) return;
        
        if (key === 'v') {
            e.preventDefault();
            if (!vKeyHeld) {
                vKeyHeld = true;
                const keyVDiv = document.getElementById('keyV');
                if (keyVDiv) flashKey(keyVDiv);
            }
        }
        
        if (key === 's') {
            e.preventDefault();
            if (!sKeyHeld) {
                sKeyHeld = true;
                const keySDiv = document.getElementById('keyS');
                if (keySDiv) flashKey(keySDiv);
            }
        }
        
        if (vKeyHeld && sKeyHeld) {
            openModal();
        }
    });
    
    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'v') vKeyHeld = false;
        if (key === 's') sKeyHeld = false;
    });
    
    if (closeBtn) closeBtn.addEventListener('click', closeModalFunc);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModalFunc();
    });
    
    if (commandInput) {
        commandInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = commandInput.value.trim().toLowerCase();
                if (val === 'v s' || val === 'vs' || val === 'v+s') {
                    openModal();
                    commandInput.value = '';
                } else if (val !== '') {
                    commandInput.value = '';
                }
            }
        });
    }
    
    const matrixSpan = document.getElementById('matrixText');
    let matrixStrings = [
        ">_ access denied",
        ">_ allow V+S", 
        ">_ perm_17", 
        "01110000 01100001 01110011 01101000 01100001",
        ">_ waiting",
        ">_ v+s = bio"
    ];
    let idx = 0;
    setInterval(() => {
        if (matrixSpan) {
            idx = (idx + 1) % matrixStrings.length;
            matrixSpan.textContent = matrixStrings[idx];
        }
    }, 2800);
    
    createStars();
    
    const textElement = document.getElementById('blinkingText');
    if (textElement) {
        const originalText = textElement.innerText;
        textElement.innerText = '';
        let i = 0;
        function typeWriter() {
            if (i < originalText.length && textElement) {
                textElement.innerText += originalText.charAt(i);
                i++;
                setTimeout(typeWriter, 80);
            }
        }
        typeWriter();
    }
</script>
</body>
</html>
