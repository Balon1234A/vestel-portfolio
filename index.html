<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vestel | Sceleton Army — Elite Cyber Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            font-family: 'Space Grotesk', monospace;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        /* КРУТОЙ КАСТОМНЫЙ КУРСОР */
        .cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid #ff2e6e;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: 0.08s ease;
            box-shadow: 0 0 15px #ff2e6e;
        }
        .cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: #ff2e6e;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: 0.05s ease;
        }
        .cursor.active {
            width: 50px;
            height: 50px;
            background: rgba(255, 46, 110, 0.2);
            backdrop-filter: blur(4px);
        }

        /* THREE.JS КАНВАС */
        canvas#webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* СЛОЙ С ЭФФЕКТАМИ */
        .overlay-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* ГЛИТЧ-ЛАЙНЫ */
        .glitch-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.3;
            background: repeating-linear-gradient(0deg, rgba(255,0,100,0.1) 0px, rgba(255,0,100,0.1) 2px, transparent 2px, transparent 6px);
            animation: glitchMove 0.2s infinite;
        }
        @keyframes glitchMove {
            0% { transform: translateY(0); opacity: 0.2; }
            100% { transform: translateY(4px); opacity: 0.4; }
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        .main-content {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
        }

        /* NEON CYBER КАРД */
        .cyber-card {
            max-width: 550px;
            width: 100%;
            background: rgba(8, 8, 20, 0.55);
            backdrop-filter: blur(20px) saturate(180%);
            border-radius: 40px;
            border: 1px solid rgba(255, 46, 110, 0.5);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 30px rgba(255,46,110,0.2), inset 0 0 30px rgba(255,46,110,0.1);
            padding: 45px 35px;
            transition: 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            animation: floatCard 4s ease-in-out infinite;
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .cyber-card:hover {
            border-color: #ff2e6e;
            box-shadow: 0 30px 55px rgba(0,0,0,0.6), 0 0 50px rgba(255,46,110,0.4);
            transform: scale(1.02);
        }

        /* ЛЕНГВИЧ */
        .lang-wrap {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 20px;
        }
        .lang-btn {
            background: rgba(255,46,110,0.15);
            border: 1px solid rgba(255,46,110,0.5);
            border-radius: 30px;
            padding: 6px 18px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            color: #ff99bb;
            letter-spacing: 1px;
        }
        .lang-btn.active {
            background: #ff2e6e;
            color: white;
            box-shadow: 0 0 15px #ff2e6e;
        }

        /* АВАТАР С ГЛОУ */
        .avatar-cyber {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }
        .avatar-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff2e6e, #ff8a5c, #ff2e6e);
            animation: spinRing 3s linear infinite;
            filter: blur(8px);
        }
        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }
        .avatar-img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff2e6e;
            box-shadow: 0 0 40px #ff2e6e;
            transition: 0.3s;
        }
        .avatar-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ТИПОГРАФИКА */
        .nick-glitch {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ff2e6e, #ff8a5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255,46,110,0.5);
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .badges {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .badge-cyber {
            background: rgba(255,46,110,0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,46,110,0.5);
            border-radius: 50px;
            padding: 5px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .bio-cyber {
            background: rgba(0,0,0,0.6);
            border-left: 4px solid #ff2e6e;
            border-radius: 20px;
            padding: 15px 20px;
            margin: 20px 0;
            text-align: center;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        /* КНОПКИ НЕОНОВЫЕ */
        .social-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 25px 0;
        }
        .cyber-btn {
            background: rgba(10,10,20,0.8);
            border: 1.5px solid rgba(255,46,110,0.6);
            border-radius: 60px;
            padding: 12px 28px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: white;
            backdrop-filter: blur(8px);
        }
        .cyber-btn i {
            font-size: 1.3rem;
            color: #ff2e6e;
            transition: 0.2s;
        }
        .cyber-btn:hover {
            background: #ff2e6e;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(255,46,110,0.5);
            border-color: white;
        }
        .cyber-btn:hover i {
            color: white;
        }
        .info-btn-full {
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        /* АДМИН ПАНЕЛЬ FUTURISTIC */
        .admin-trigger {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 48px;
            height: 48px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border: 1px solid #ff2e6e;
            cursor: pointer;
            transition: 0.2s;
        }
        .admin-trigger:hover {
            background: #ff2e6e;
            transform: scale(1.1);
            box-shadow: 0 0 20px #ff2e6e;
        }
        .admin-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: linear-gradient(135deg, #0a0a1a, #000000);
            border-radius: 35px;
            padding: 30px;
            max-width: 480px;
            width: 90%;
            z-index: 10001;
            border: 2px solid #ff2e6e;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            box-shadow: 0 0 60px rgba(255,46,110,0.3);
        }
        .admin-modal.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #ff2e6e;
        }
        .admin-input, .admin-select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid #ff2e6e;
            border-radius: 30px;
            color: white;
        }
        .admin-btn {
            background: #ff2e6e;
            border: none;
            padding: 10px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        /* МОДАЛКА ИНФО */
        .info-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .info-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .info-window {
            background: linear-gradient(145deg, #111122, #050510);
            border-radius: 50px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            border: 2px solid #ff2e6e;
            text-align: center;
        }
        .info-window h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff2e6e, #ffaa66);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .info-row {
            text-align: left;
            margin: 15px 0;
            font-size: 1rem;
        }
        .info-row i {
            width: 30px;
            color: #ff2e6e;
        }
        .close-info {
            background: #ff2e6e;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .footer-cyber {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 0.7rem;
            color: #ff99bb;
            border-top: 1px dashed rgba(255,46,110,0.4);
            padding-top: 18px;
        }

        @media (max-width: 550px) {
            .cyber-card { padding: 25px 18px; }
            .nick-glitch { font-size: 1.6rem; }
            .avatar-cyber { width: 110px; height: 110px; }
        }
    </style>
</head>

<!-- THREE.JS + 3D ЭФФЕКТЫ С ПЕРСОНАЖЕМ -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // ИНИЦИАЛИЗАЦИЯ СЦЕНЫ
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 12);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // СВЕТ
    const ambientLight = new THREE.AmbientLight(0x111111);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xff3366, 1);
    mainLight.position.set(2, 3, 4);
    scene.add(mainLight);
    const backLight = new THREE.PointLight(0xff2e6e, 0.8);
    backLight.position.set(-2, 1, -3);
    scene.add(backLight);
    const fillLight = new THREE.PointLight(0xffaa88, 0.5);
    fillLight.position.set(1, 2, 2);
    scene.add(fillLight);

    // ЧАСТИЦЫ ТУМАННОСТИ
    const particleCount = 2500;
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesPos = [];
    for (let i = 0; i < particleCount; i++) {
        particlesPos.push((Math.random() - 0.5) * 40);
        particlesPos.push((Math.random() - 0.5) * 25);
        particlesPos.push((Math.random() - 0.5) * 30 - 15);
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(particlesPos), 3));
    const particlesMat = new THREE.PointsMaterial({ color: 0xff4d8c, size: 0.08, transparent: true, opacity: 0.4 });
    const particleSystem = new THREE.Points(particlesGeometry, particlesMat);
    scene.add(particleSystem);

    // ГРУППА ДЛЯ ВРАЩАЮЩИХСЯ КОЛЕЦ
    const ringGroup = new THREE.Group();
    const ringGeo = new THREE.TorusGeometry(2.2, 0.05, 64, 300);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xff2e6e, emissive: 0xff1155, emissiveIntensity: 0.8 });
    const ring1 = new THREE.Mesh(ringGeo, ringMat);
    ring1.rotation.x = Math.PI / 2;
    ringGroup.add(ring1);
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.7, 0.04, 64, 300), ringMat);
    ring2.rotation.z = Math.PI / 3;
    ringGroup.add(ring2);
    const ring3 = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.06, 64, 400), ringMat);
    ring3.rotation.x = Math.PI / 2.5;
    ringGroup.add(ring3);
    scene.add(ringGroup);

    // ПАРЯЩИЕ СФЕРЫ
    const orbGroup = new THREE.Group();
    for (let i = 0; i < 60; i++) {
        const orb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshStandardMaterial({ color: 0xff66aa, emissive: 0xff2e6e, emissiveIntensity: 0.5 }));
        const angle = (i / 60) * Math.PI * 2;
        const radius = 3.8;
        orb.position.set(Math.cos(angle) * radius, Math.sin(angle * 2) * 1.2, Math.sin(angle) * radius);
        orbGroup.add(orb);
    }
    scene.add(orbGroup);

    // 3D МОДЕЛЬ ЧЕРЕПА / СКЕЛЕТОНА (стилизованный объект)
    const skullGroup = new THREE.Group();
    const skullMat = new THREE.MeshStandardMaterial({ color: 0xdd88aa, emissive: 0x552233, roughness: 0.3, metalness: 0.7 });
    const mainSkull = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), skullMat);
    mainSkull.scale.set(0.9, 0.95, 0.8);
    skullGroup.add(mainSkull);
    const jaw = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 32), skullMat);
    jaw.position.set(0, -0.5, 0.3);
    jaw.scale.set(0.9, 0.5, 0.7);
    skullGroup.add(jaw);
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.18, 24, 24), new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff2e6e, emissiveIntensity: 1.2 }));
    eyeL.position.set(-0.28, 0.15, 0.65);
    skullGroup.add(eyeL);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.18, 24, 24), new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff2e6e, emissiveIntensity: 1.2 }));
    eyeR.position.set(0.28, 0.15, 0.65);
    skullGroup.add(eyeR);
    skullGroup.position.set(0, -0.8, -2.5);
    skullGroup.scale.set(0.9, 0.9, 0.9);
    scene.add(skullGroup);

    // АНИМАЦИЯ
    let time = 0;
    function animate3D() {
        requestAnimationFrame(animate3D);
        time += 0.012;
        
        ringGroup.rotation.x = time * 0.2;
        ringGroup.rotation.y = time * 0.15;
        ringGroup.rotation.z = time * 0.1;
        
        orbGroup.rotation.y = time * 0.2;
        orbGroup.rotation.x = Math.sin(time * 0.3) * 0.2;
        
        particleSystem.rotation.y = time * 0.03;
        particleSystem.rotation.x = Math.sin(time * 0.1) * 0.1;
        
        skullGroup.position.y = -0.8 + Math.sin(time * 1.5) * 0.05;
        skullGroup.rotation.y = Math.sin(time * 0.6) * 0.2;
        
        const glowIntensity = 0.8 + Math.sin(time * 5) * 0.3;
        eyeL.material.emissiveIntensity = glowIntensity;
        eyeR.material.emissiveIntensity = glowIntensity;
        
        camera.position.x += (0 - camera.position.x) * 0.05;
        camera.position.y += (1.4 - camera.position.y) * 0.05;
        camera.lookAt(0, 0.2, 0);
        
        renderer.render(scene, camera);
    }
    animate3D();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

<script type="text/javascript">
    // ----- ОСНОВНАЯ ЛОГИКА САЙТА -----
    const translations = {
        ru: { badgeRole: "💀 Sceleton Army", bio: "Должности: Sceleton Army - Curator, Support", infoText: "ПРОФИЛЬ", footerQuote: "Sceleton Elite", modalTitle: "🌸 VESTEL INFO", infoNameLbl: "Имя:", infoAgeLbl: "Возраст:", infoBirthLbl: "ДР:", infoCityLbl: "Город:", infoRoleLbl: "Роль:", robloxText: "Roblox", telegramText: "@vest_ell", discordText: "vest_el", nick: "vestel", age: "17 лет", birth: "28 августа", city: "Пермь", role: "Sceleton Army - Curator, Support", nameVal: "Паша" },
        en: { badgeRole: "💀 Sceleton Army", bio: "Roles: Sceleton Army - Curator, Support", infoText: "PROFILE", footerQuote: "Sceleton Elite", modalTitle: "🌸 VESTEL INFO", infoNameLbl: "Name:", infoAgeLbl: "Age:", infoBirthLbl: "Birth:", infoCityLbl: "City:", infoRoleLbl: "Role:", robloxText: "Roblox", telegramText: "@vest_ell", discordText: "vest_el", nick: "vestel", age: "17 y.o", birth: "Aug 28", city: "Perm", role: "Sceleton Army - Curator, Support", nameVal: "Pasha" }
    };
    let currentLang = 'ru';
    
    function updateLang() {
        const t = translations[currentLang];
        document.getElementById('badgeRole').innerHTML = t.badgeRole;
        document.getElementById('bioText').innerHTML = t.bio;
        document.getElementById('infoText').innerHTML = t.infoText;
        document.getElementById('footerQuote').innerHTML = t.footerQuote;
        document.getElementById('modalTitle').innerHTML = t.modalTitle;
        document.getElementById('infoNameLbl').innerHTML = t.infoNameLbl;
        document.getElementById('infoAgeLbl').innerHTML = t.infoAgeLbl;
        document.getElementById('infoBirthLbl').innerHTML = t.infoBirthLbl;
        document.getElementById('infoCityLbl').innerHTML = t.infoCityLbl;
        document.getElementById('infoRoleLbl').innerHTML = t.infoRoleLbl;
        document.getElementById('robloxText').innerHTML = t.robloxText;
        document.getElementById('telegramText').innerHTML = t.telegramText;
        document.getElementById('discordText').innerHTML = t.discordText;
        document.getElementById('userNick').innerHTML = '@' + t.nick;
        document.getElementById('userAge').innerHTML = '🎂 ' + t.age;
        document.getElementById('infoBirthVal').innerHTML = t.birth;
        document.getElementById('infoCityVal').innerHTML = t.city;
        document.getElementById('infoRoleVal').innerHTML = t.role;
        document.getElementById('infoAgeVal').innerHTML = t.age;
        document.getElementById('infoNameVal').innerHTML = t.nameVal;
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if(btn.dataset.lang === currentLang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }
    
    // КУРСОР
    const cursor = document.createElement('div'); cursor.className = 'cursor'; document.body.appendChild(cursor);
    const cursorDot = document.createElement('div'); cursorDot.className = 'cursor-dot'; document.body.appendChild(cursorDot);
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        cursorDot.style.left = e.clientX + 'px';
        cursorDot.style.top = e.clientY + 'px';
        const hover = e.target.closest('.cyber-btn, .lang-btn, .admin-trigger, .close-info');
        if(hover) cursor.classList.add('active');
        else cursor.classList.remove('active');
    });
    
    function playSound() {
        try {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            if(ctx.state === 'suspended') ctx.resume();
            let osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.frequency.value = 840;
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }
    
    function showToast(msg) {
        let div = document.createElement('div');
        div.style.position = 'fixed'; div.style.bottom = '30px'; div.style.left = '50%';
        div.style.transform = 'translateX(-50%)'; div.style.background = '#ff2e6e';
        div.style.color = 'white'; div.style.padding = '12px 28px'; div.style.borderRadius = '50px';
        div.style.zIndex = '20000'; div.style.fontWeight = 'bold'; div.style.fontSize = '0.9rem';
        div.innerText = msg; document.body.appendChild(div);
        setTimeout(() => div.remove(), 2000);
    }
    
    // АДМИНКА
    let adminLogged = false;
    const adminPanel = document.getElementById('adminPanel');
    const adminTrigger = document.getElementById('adminTrigger');
    const closeAdminBtn = document.getElementById('closeAdminBtn');
    const adminLoginBtn = document.getElementById('adminLoginBtn');
    const adminPass = document.getElementById('adminPass');
    const settingsArea = document.getElementById('adminSettingsArea');
    const applyAdmin = document.getElementById('applyAdmin');
    const resetAdmin = document.getElementById('resetAdmin');
    const logoutAdmin = document.getElementById('logoutAdmin');
    
    adminTrigger.onclick = () => { playSound(); adminPanel.classList.add('active'); adminPass.value = ''; settingsArea.style.display = 'none'; };
    closeAdminBtn.onclick = () => { adminPanel.classList.remove('active'); };
    adminLoginBtn.onclick = () => {
        playSound();
        if(adminPass.value === 'Pawel775577зфцул775577') {
            settingsArea.style.display = 'block';
            document.getElementById('setNick').value = document.getElementById('userNick').innerText.replace('@','');
            document.getElementById('setBio').value = document.getElementById('bioText').innerText.replace('Должности: ','').replace('Roles: ','');
            document.getElementById('setAge').value = document.getElementById('userAge').innerText.replace('🎂 ','');
            document.getElementById('setBirth').value = document.getElementById('infoBirthVal').innerText;
            document.getElementById('setCity').value = document.getElementById('infoCityVal').innerText;
            showToast('✅ Добро пожаловать, командир!');
        } else { showToast('❌ Неверный пароль!'); adminPanel.classList.remove('active'); }
    };
    applyAdmin.onclick = () => {
        playSound();
        let newColor = document.getElementById('setColor').value;
        document.documentElement.style.setProperty('--accent-color', newColor);
        document.querySelectorAll('.cyber-btn, .lang-btn, .admin-trigger, .close-info').forEach(el => el.style.setProperty('border-color', newColor));
        let glowMode = document.getElementById('setGlow').value;
        if(glowMode === 'off') document.querySelector('.avatar-ring').style.opacity = '0.3';
        else document.querySelector('.avatar-ring').style.opacity = '1';
        showToast('✅ Стиль обновлён!');
        // сохраняем в localStorage опционально
        localStorage.setItem('neonColor', newColor);
        localStorage.setItem('glowMode', glowMode);
    };
    resetAdmin.onclick = () => { localStorage.clear(); location.reload(); };
    logoutAdmin.onclick = () => { adminPanel.classList.remove('active'); showToast('🔒 Выход'); };
    
    // МОДАЛКА ИНФО
    const infoModal = document.getElementById('infoModal');
    const infoBtn = document.getElementById('infoBtn');
    const closeInfoBtn = document.getElementById('closeInfoBtn');
    infoBtn.onclick = () => { playSound(); infoModal.classList.add('active'); };
    closeInfoBtn.onclick = () => { infoModal.classList.remove('active'); };
    infoModal.onclick = (e) => { if(e.target === infoModal) infoModal.classList.remove('active'); };
    
    // КОПИРОВАНИЕ DISCORD
    document.getElementById('discordBtn').onclick = async () => {
        playSound();
        await navigator.clipboard.writeText('vest_el');
        showToast('✅ Discord скопирован: vest_el');
    };
    
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.onclick = () => { playSound(); currentLang = btn.dataset.lang; updateLang(); };
    });
    
    // восстанавливаем сохраненный цвет
    const savedColor = localStorage.getItem('neonColor');
    if(savedColor) document.documentElement.style.setProperty('--accent-color', savedColor);
    updateLang();
    
    // ЗВУК ДЛЯ КЛИКОВ
    document.querySelectorAll('.cyber-btn, .lang-btn, .close-info, .admin-trigger').forEach(el => {
        el.addEventListener('click', playSound);
    });
    
    // ЭФФЕКТ ГЛИТЧА ПО КЛИКУ
    document.body.addEventListener('click', () => {
        const glitch = document.querySelector('.glitch-lines');
        glitch.style.opacity = '0.7';
        setTimeout(() => glitch.style.opacity = '0.3', 100);
    });
</script>
