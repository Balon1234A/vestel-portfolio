<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vestel | Sceleton Army | Sakura Garden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            cursor: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background: #0a0a0a;
            color: #fff;
            position: relative;
        }

        /* КАСТОМНЫЙ КУРСОР В ВИДЕ САКУРЫ */
        .custom-cursor {
            position: fixed;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: transform 0.05s ease;
            font-size: 28px;
            filter: drop-shadow(0 0 4px #ff69b4);
        }

        a, button, .social-btn, .info-btn, .lang-btn, .modal-close {
            cursor: none;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ПОЛЕ ЦВЕТУЩЕЙ САКУРЫ (ВМЕСТО ТРАВЫ) */
        .sakura-field {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            pointer-events: none;
            z-index: 6;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            gap: 8px;
            padding: 0 15px;
        }
        
        .flower-stem {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: swayFlower 3s infinite ease-in-out;
            transform-origin: bottom center;
        }
        
        .flower-stem:nth-child(even) { animation-duration: 3.5s; animation-delay: 0.5s; }
        .flower-stem:nth-child(odd) { animation-duration: 2.8s; animation-delay: 0.2s; }
        
        @keyframes swayFlower {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(4deg); }
        }
        
        .flower {
            font-size: 1.1rem;
            filter: drop-shadow(0 0 6px rgba(255,105,180,0.5));
            transition: all 0.3s ease;
            opacity: 0.85;
        }
        
        .flower-stem:nth-child(3n) .flower { font-size: 1rem; opacity: 0.7; }
        .flower-stem:nth-child(5n+2) .flower { font-size: 1.3rem; opacity: 0.9; }
        
        .stem-line {
            width: 2px;
            height: 25px;
            background: linear-gradient(to top, #ff69b4, transparent);
            margin-bottom: 3px;
            opacity: 0.5;
        }

        /* РЕАЛИСТИЧНЫЕ ВЕТКИ САКУРЫ (без агрессивного свечения) */
        .real-branch {
            position: fixed;
            top: 0;
            width: 300px;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 0.7;
        }
        
        .real-branch.left { left: 0; }
        .real-branch.right { right: 0; }
        
        .branch-svg {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
        }
        
        @keyframes swayLeftReal {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(-3px) rotate(0.5deg); }
        }
        @keyframes swayRightReal {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(3px) rotate(-0.5deg); }
        }
        .real-branch.left { animation: swayLeftReal 7s ease-in-out infinite; }
        .real-branch.right { animation: swayRightReal 7s ease-in-out infinite; }

        /* Лёгкий туман внизу */
        .ground-fog {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            background: radial-gradient(ellipse at center, rgba(255,105,180,0.08) 0%, transparent 80%);
            pointer-events: none;
            z-index: 4;
            filter: blur(20px);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent, rgba(0,0,0,0.55));
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Карточка */
        .epic-card {
            max-width: 500px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            border: 1px solid rgba(255, 105, 180, 0.6);
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.3), inset 0 0 30px rgba(255, 105, 180, 0.1);
            padding: 35px 30px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .epic-card.float-active {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* Переключатель языка */
        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }
        .lang-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,105,180,0.3);
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
        }
        .lang-btn.active {
            background: var(--accent-color, #ff69b4);
            border-color: var(--accent-color, #ff69b4);
        }
        .lang-btn:hover {
            background: var(--accent-color, #ff69b4);
            transform: scale(1.05);
        }

        /* Аватар */
        .avatar-section {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
        }
        .avatar-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--accent-color, #ff69b4);
            opacity: 0.6;
            animation: pulse 2s infinite;
            z-index: 0;
        }
        .avatar-pulse.pulse-off { animation: none; opacity: 0.2; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .avatar {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent-color, #ff69b4);
            box-shadow: 0 0 30px var(--accent-color, #ff69b4);
            z-index: 1;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* Текст */
        .name {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #fff, var(--accent-color, #ff69b4), #ff99cc, var(--accent-color, #ff69b4));
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 10px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .nick {
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            color: var(--accent-color, #ff99cc);
            background: rgba(255, 105, 180, 0.12);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 60px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        .nick-wrapper { text-align: center; }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,105,180,0.2);
            border-radius: 50px;
            padding: 5px 16px;
            font-size: 0.75rem;
            margin: 0 5px;
        }
        .bio {
            font-size: 0.95rem;
            color: #eaeaea;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            padding: 12px 18px;
            line-height: 1.5;
            border-left: 2px solid var(--accent-color, #ff69b4);
            text-align: center;
        }

        /* Кнопки */
        .social-links, .info-btn { margin: 25px 0; text-align: center; }
        .social-links { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .social-btn, .info-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,105,180,0.3);
            border-radius: 50px;
            padding: 12px 25px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .social-btn:hover, .info-btn:hover {
            background: var(--accent-color, #ff69b4);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,105,180,0.4);
        }
        .info-btn { width: 100%; justify-content: center; margin-top: 5px; }

        /* Админ-панель */
        .admin-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 35px;
            height: 35px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            border: 1px solid rgba(255,105,180,0.15);
            transition: 0.2s;
            font-size: 0.9rem;
            color: rgba(255,105,180,0.3);
        }
        .admin-trigger:hover {
            background: rgba(255,105,180,0.2);
            color: rgba(255,105,180,0.7);
            transform: scale(1.05);
        }
        .admin-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: linear-gradient(135deg, #1a1a2e, #0d0d1a);
            border-radius: 30px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            z-index: 20000;
            border: 2px solid var(--accent-color, #ff69b4);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .admin-panel.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .admin-header h3 { color: var(--accent-color, #ff69b4); }
        .admin-close-x { background: none; border: none; color: #ff69b4; font-size: 1.5rem; cursor: pointer; }
        .admin-panel input, .admin-panel select {
            width: 100%; padding: 8px 12px; margin: 8px 0;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,105,180,0.3);
            border-radius: 30px; color: white; outline: none;
        }
        .admin-panel button {
            background: var(--accent-color, #ff69b4); border: none; padding: 8px 16px;
            border-radius: 30px; color: white; cursor: pointer; width: 100%; margin-top: 8px;
        }
        .admin-settings { margin-top: 15px; border-top: 1px solid rgba(255,105,180,0.3); padding-top: 15px; max-height: 400px; overflow-y: auto; }
        .setting-row { margin: 12px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .setting-row label { font-size: 0.8rem; color: #ccc; min-width: 110px; }
        .setting-row input, .setting-row select { width: auto; flex: 1; margin: 0; }
        .setting-row input[type="color"] { width: 50px; height: 35px; }
        .reset-btn { background: rgba(255,100,100,0.3); margin-top: 15px; }
        .reset-btn:hover { background: #ff4444; }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            z-index: 10000; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-window {
            background: linear-gradient(135deg, #1a1a2e, #0d0d1a);
            border-radius: 40px; padding: 35px 30px; max-width: 380px; width: 90%;
            text-align: center; border: 2px solid var(--accent-color, #ff69b4);
            transform: scale(0.9); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-window { transform: scale(1); }
        .modal-window h2 { font-size: 2rem; margin-bottom: 20px; background: linear-gradient(135deg, var(--accent-color, #ff69b4), #ff99cc); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .modal-info { text-align: left; margin: 20px 0; font-size: 1rem; line-height: 2; }
        .modal-info i { width: 28px; color: var(--accent-color, #ff69b4); margin-right: 10px; }
        .modal-close {
            background: linear-gradient(135deg, var(--accent-color, #ff69b4), #ff3388);
            border: none; border-radius: 40px; padding: 12px 30px; color: white;
            font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        .toast-notification {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, var(--accent-color, #ff69b4), #ff3388);
            color: white; padding: 12px 24px; border-radius: 50px; font-weight: 600;
            z-index: 10001; animation: toastFade 2s ease forwards; pointer-events: none;
        }
        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        .footer-stuff {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 25px; font-size: 0.7rem; color: #ff99cc;
            border-top: 1px dashed rgba(255,105,180,0.3); padding-top: 18px;
        }
        @media (max-width: 550px) {
            .epic-card { padding: 25px 20px; }
            .name { font-size: 2rem; }
            .avatar-section, .avatar { width: 110px; height: 110px; }
            .real-branch { width: 150px; opacity: 0.5; }
            .sakura-field { height: 90px; gap: 4px; }
            .flower { font-size: 0.8rem; }
            .stem-line { height: 15px; }
        }
    </style>
</head>

            <p><i class="fas fa-city"></i> <strong id="infoCityLabel">Город:</strong> <span id="infoCityValue">Пермь</span></p>
            <p><i class="fas fa-skull"></i> <strong id="infoRoleLabel">Должность:</strong> <span id="infoRoleValue">Sceleton Army - Curator, Support</span></p>
        </div>
        <button class="modal-close" id="closeModalBtn">✨ <span id="closeText">Закрыть</span> ✨</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    (function() {
        // --- МУЛЬТИЯЗЫЧНОСТЬ ---
        const translations = {
            ru: {
                badgeRole: "💀 Sceleton Army",
                bio: "Должности: Sceleton Army - Curator, Support",
                infoText: "INFO",
                footerQuote: "Sceleton Army",
                modalTitle: "🌸 INFO",
                infoNameLabel: "Имя:",
                infoAgeLabel: "Возраст:",
                infoBirthLabel: "День рождения:",
                infoCityLabel: "Город:",
                infoRoleLabel: "Должность:",
                closeText: "Закрыть",
                robloxText: "Roblox",
                telegramText: "@vest_ell",
                discordText: "vest_el",
                name: "Паша",
                nick: "vestel",
                age: "17 лет",
                birth: "28 августа",
                city: "Пермь",
                role: "Sceleton Army - Curator, Support"
            },
            en: {
                badgeRole: "💀 Sceleton Army",
                bio: "Roles: Sceleton Army - Curator, Support",
                infoText: "INFO",
                footerQuote: "Sceleton Army",
                modalTitle: "🌸 INFO",
                infoNameLabel: "Name:",
                infoAgeLabel: "Age:",
                infoBirthLabel: "Birthday:",
                infoCityLabel: "City:",
                infoRoleLabel: "Role:",
                closeText: "Close",
                robloxText: "Roblox",
                telegramText: "@vest_ell",
                discordText: "vest_el",
                name: "Pasha",
                nick: "vestel",
                age: "17 years old",
                birth: "August 28",
                city: "Perm",
                role: "Sceleton Army - Curator, Support"
            }
        };
        let currentLang = 'ru';
        function updateUILanguage() {
            const t = translations[currentLang];
            document.getElementById('badgeRole').innerHTML = t.badgeRole;
            document.getElementById('bioText').innerHTML = t.bio;
            document.getElementById('infoText').innerHTML = t.infoText;
            document.getElementById('footerQuote').innerHTML = t.footerQuote;
            document.getElementById('modalTitle').innerHTML = t.modalTitle;
            document.getElementById('infoNameLabel').innerHTML = t.infoNameLabel;
            document.getElementById('infoAgeLabel').innerHTML = t.infoAgeLabel;
            document.getElementById('infoBirthLabel').innerHTML = t.infoBirthLabel;
            document.getElementById('infoCityLabel').innerHTML = t.infoCityLabel;
            document.getElementById('infoRoleLabel').innerHTML = t.infoRoleLabel;
            document.getElementById('closeText').innerHTML = t.closeText;
            document.getElementById('robloxText').innerHTML = t.robloxText;
            document.getElementById('telegramText').innerHTML = t.telegramText;
            document.getElementById('discordText').innerHTML = t.discordText;
            document.getElementById('userName').innerHTML = t.name;
            document.getElementById('userNick').innerHTML = '@' + t.nick;
            document.getElementById('userAge').innerHTML = '🎂 ' + t.age;
            document.getElementById('infoBirthValue').innerHTML = t.birth;
            document.getElementById('infoCityValue').innerHTML = t.city;
            document.getElementById('infoRoleValue').innerHTML = t.role;
            document.getElementById('infoNameValue').innerHTML = t.name;
            document.getElementById('infoAgeValue').innerHTML = t.age;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                if(btn.getAttribute('data-lang') === currentLang) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        // --- ЛОГИКА АДМИНКИ И ФОНА ---
        let sakuraEnabled = true, sakuraInterval, audioContext = null;
        function restartSakura() { if(sakuraInterval) clearInterval(sakuraInterval); if(!sakuraEnabled) return; sakuraInterval = setInterval(() => { if(sakuraEnabled) for(let i=0;i<(Math.random()>0.7?2:1);i++) setTimeout(createSakura, i*100); }, 2500); }
        function playClickSound() { try { if(!audioContext) audioContext = new (window.AudioContext||window.webkitAudioContext)(); if(audioContext.state==='suspended') audioContext.resume().then(()=>{let o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.15,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,audioContext.currentTime+0.3);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+0.2);}).catch(()=>{}); else {let o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.15,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,audioContext.currentTime+0.3);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+0.2);} } catch(e){} }
        function showToast(msg) { let t=document.querySelector('.toast-notification'); if(t)t.remove(); let d=document.createElement('div'); d.className='toast-notification'; d.innerHTML=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2000); }
        function loadSettings() { let s=JSON.parse(localStorage.getItem('adminSettings')||'{}'); if(s.accentColor) document.documentElement.style.setProperty('--accent-color', s.accentColor); if(s.sakura==='off') sakuraEnabled=false; else sakuraEnabled=true; if(s.floatAnim==='off') document.getElementById('mainCard').classList.remove('float-active'); else document.getElementById('mainCard').classList.add('float-active'); if(s.glowEffect==='off') document.getElementById('avatarPulse').classList.add('pulse-off'); else document.getElementById('avatarPulse').classList.remove('pulse-off'); restartSakura(); }
        function saveSettings() { let s={accentColor:getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim()||'#ff69b4',sakura:sakuraEnabled?'on':'off',floatAnim:document.getElementById('mainCard').classList.contains('float-active')?'on':'off',glowEffect:document.getElementById('avatarPulse').classList.contains('pulse-off')?'off':'on'}; localStorage.setItem('adminSettings',JSON.stringify(s)); }

        // Админка
        const adminTrigger = document.getElementById('adminTrigger'), adminPanel = document.getElementById('adminPanel'), adminLoginBtn = document.getElementById('adminLoginBtn'), adminPassword = document.getElementById('adminPassword'), adminSettingsDiv = document.getElementById('adminSettings'), applyBtn = document.getElementById('applySettingsBtn'), resetBtn = document.getElementById('resetSettingsBtn'), logoutBtn = document.getElementById('logoutAdminBtn'), closeAdminXBtn = document.getElementById('closeAdminXBtn');
        function closeAdminPanel() { adminPanel.classList.remove('active'); adminSettingsDiv.style.display = 'none'; }
        adminTrigger.onclick = () => { playClickSound(); adminPanel.classList.add('active'); adminPassword.value=''; adminSettingsDiv.style.display='none'; };
        closeAdminXBtn.onclick = () => { playClickSound(); closeAdminPanel(); };
        logoutBtn.onclick = () => { playClickSound(); closeAdminPanel(); showToast('🔒 Вы вышли'); };
        adminLoginBtn.onclick = () => { playClickSound(); if(adminPassword.value==='Pawel775577') { adminSettingsDiv.style.display='block'; document.getElementById('adminName').value=document.getElementById('userName').innerHTML; document.getElementById('adminNick').value=document.getElementById('userNick').innerHTML.replace('@',''); document.getElementById('adminRole').value=document.getElementById('bioText').innerHTML.replace('Должности: ','').replace('Roles: ',''); document.getElementById('adminAge').value=document.getElementById('userAge').innerHTML.replace('🎂 ',''); document.getElementById('adminBirth').value=document.getElementById('infoBirthValue').innerHTML; document.getElementById('adminCity').value=document.getElementById('infoCityValue').innerHTML; document.getElementById('adminColor').value=getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim()||'#ff69b4'; document.getElementById('adminSakura').value=sakuraEnabled?'on':'off'; document.getElementById('adminFloatAnim').value=document.getElementById('mainCard').classList.contains('float-active')?'on':'off'; document.getElementById('adminGlowEffect').value=document.getElementById('avatarPulse').classList.contains('pulse-off')?'off':'on'; showToast('✅ Добро пожаловать!'); } else { showToast('❌ Неверный пароль!'); closeAdminPanel(); } };
        applyBtn.onclick = () => { playClickSound(); let newColor=document.getElementById('adminColor').value; document.documentElement.style.setProperty('--accent-color', newColor); if(document.getElementById('adminSakura').value==='off') sakuraEnabled=false; else sakuraEnabled=true; if(document.getElementById('adminFloatAnim').value==='off') document.getElementById('mainCard').classList.remove('float-active'); else document.getElementById('mainCard').classList.add('float-active'); if(document.getElementById('adminGlowEffect').value==='off') document.getElementById('avatarPulse').classList.add('pulse-off'); else document.getElementById('avatarPulse').classList.remove('pulse-off'); restartSakura(); saveSettings(); showToast('✅ Настройки применены!'); };
        resetBtn.onclick = () => { playClickSound(); localStorage.removeItem('adminSettings'); location.reload(); };

        // --- 3D ФОН ---
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0a0a);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000); camera.position.set(0,0,35);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: false }); renderer.setSize(window.innerWidth, window.innerHeight);
        const pCount=4000, posArray=new Float32Array(pCount*3); for(let i=0;i<pCount;i++){ posArray[i*3]=(Math.random()-0.5)*200; posArray[i*3+1]=(Math.random()-0.5)*120; posArray[i*3+2]=(Math.random()-0.5)*100-30; }
        const pGeo=new THREE.BufferGeometry(); pGeo.setAttribute('position',new THREE.BufferAttribute(posArray,3)); const pMat=new THREE.PointsMaterial({color:0xff69b4,size:0.18,transparent:true,opacity:0.4}); const pSys=new THREE.Points(pGeo,pMat); scene.add(pSys);
        const ringGeo=new THREE.TorusGeometry(6,0.12,64,300), ringMat=new THREE.MeshStandardMaterial({color:0xff69b4,emissive:0xff3388,emissiveIntensity:0.5}); const ring=new THREE.Mesh(ringGeo,ringMat); scene.add(ring); const ring2=new THREE.Mesh(new THREE.TorusGeometry(8,0.08,64,300),ringMat); scene.add(ring2);
        const sphereGroup=new THREE.Group(); for(let i=0;i<80;i++){ let s=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshStandardMaterial({color:0xff88bb,emissive:0xff3388,emissiveIntensity:0.3})); let a=(i/80)*Math.PI*2; s.position.set(Math.cos(a)*6,Math.sin(a*3)*1.8,Math.sin(a)*6); sphereGroup.add(s); } scene.add(sphereGroup);
        const light=new THREE.PointLight(0xff69b4,0.8); light.position.set(5,5,10); scene.add(light); scene.add(new THREE.AmbientLight(0x222222));
        let time=0; function animate(){ requestAnimationFrame(animate); time+=0.008; pSys.rotation.y=time*0.05; pSys.rotation.x=Math.sin(time*0.1)*0.1; ring.rotation.x=time*0.3; ring.rotation.z=time*0.2; ring2.rotation.y=time*0.5; ring2.rotation.x=time*0.2; sphereGroup.rotation.y=time*0.15; sphereGroup.rotation.x=Math.sin(time*0.4)*0.2; camera.position.x=Math.sin(time*0.2)*1.5; camera.position.y=Math.cos(time*0.25)*1; camera.lookAt(0,0,0); renderer.render(scene,camera); } animate();
        window.addEventListener('resize',()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });

        // --- ПОЛЕ САКУРЫ (цветы вместо травы) ---
        const fieldContainer = document.getElementById('sakuraField');
        const flowersCount = window.innerWidth < 768 ? 30 : 55;
        for (let i = 0; i < flowersCount; i++) {
            const stem = document.createElement('div');
            stem.className = 'flower-stem';
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerHTML = '🌸';
            const stemLine = document.createElement('div');
            stemLine.className = 'stem-line';
            stem.appendChild(stemLine);
            stem.appendChild(flower);
            fieldContainer.appendChild(stem);
        }

        // --- ЛЕПЕСТКИ САКУРЫ ---
        const sakuraSymbols=['🌸','🌸','💮','🌸','🌸','✿','❀','🌸']; let style=document.createElement('style'); style.textContent='@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg); opacity:1;}100%{transform:translateY(110vh) rotate(360deg); opacity:0;}}'; document.head.appendChild(style);
        function createSakura(){ let p=document.createElement('div'); p.innerHTML=sakuraSymbols[Math.floor(Math.random()*sakuraSymbols.length)]; p.style.position='fixed'; p.style.pointerEvents='none'; p.style.zIndex='9999'; p.style.fontSize=(18+Math.random()*20)+'px'; p.style.left=Math.random()*100+'%'; p.style.top='-50px'; p.style.opacity=0.8; p.style.animation=`fall ${5+Math.random()*6}s linear forwards`; document.body.appendChild(p); p.addEventListener('animationend',()=>p.remove()); }
        for(let i=0;i<15;i++) setTimeout(createSakura,i*150); restartSakura();

        // --- КУРСОР ---
        let cursorDiv=document.createElement('div'); cursorDiv.className='custom-cursor'; cursorDiv.innerHTML='🌸'; document.body.appendChild(cursorDiv);
        document.addEventListener('mousemove',(e)=>{ cursorDiv.style.left=e.clientX+'px'; cursorDiv.style.top=e.clientY+'px'; let t=e.target.closest('.social-btn, .info-btn, .lang-btn, .modal-close, .admin-trigger'); if(t){ cursorDiv.style.transform='translate(-50%, -50%) scale(1.3)'; cursorDiv.style.filter='drop-shadow(0 0 8px #ff69b4)'; }else{ cursorDiv.style.transform='translate(-50%, -50%) scale(1)'; cursorDiv.style.filter='drop-shadow(0 0 4px #ff69b4)'; } });
        document.addEventListener('mouseleave',()=>cursorDiv.style.opacity='0'); document.addEventListener('mouseenter',()=>cursorDiv.style.opacity='1');

        // --- ОБРАБОТЧИКИ КНОПОК ---
        document.getElementById('infoBtn').onclick=()=>{ playClickSound(); document.getElementById('infoModal').classList.add('active'); };
        document.getElementById('closeModalBtn').onclick=()=>{ playClickSound(); document.getElementById('infoModal').classList.remove('active'); };
        document.getElementById('infoModal').onclick=(e)=>{ if(e.target===document.getElementById('infoModal')) document.getElementById('infoModal').classList.remove('active'); };
        document.getElementById('discordBtn').onclick=async(e)=>{ e.preventDefault(); playClickSound(); await navigator.clipboard.writeText('vest_el'); showToast('✅ Discord скопирован: vest_el'); };
        document.querySelectorAll('.lang-btn').forEach(btn=>{ btn.onclick=()=>{ playClickSound(); currentLang=btn.getAttribute('data-lang'); updateUILanguage(); }; });
        document.getElementById('robloxLink').addEventListener('click',playClickSound);
        document.getElementById('telegramLink').addEventListener('click',playClickSound);

        function enableAudio(){ if(audioContext&&audioContext.state==='suspended') audioContext.resume(); document.removeEventListener('click',enableAudio); document.removeEventListener('touchstart',enableAudio); }
        document.addEventListener('click',enableAudio); document.addEventListener('touchstart',enableAudio);

        loadSettings(); updateUILanguage();
    })();
</script>
