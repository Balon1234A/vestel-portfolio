<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vestel | Sceleton Army</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            cursor: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background: #0a0a0a;
            color: #fff;
        }

        /* КАСТОМНЫЙ КУРСОР В ВИДЕ САКУРЫ */
        .custom-cursor {
            position: fixed;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: transform 0.05s ease;
            font-size: 28px;
            filter: drop-shadow(0 0 4px #ff69b4);
        }

        /* Убираем стандартный курсор на всех интерактивных элементах */
        a, button, .social-btn, .info-btn, .theme-btn, .like-btn, .sakura-trigger, 
        .petal-trigger, .modal-close, .lang-btn {
            cursor: none;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent, rgba(0,0,0,0.4));
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .epic-card {
            max-width: 500px;
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            border: 1px solid rgba(255, 105, 180, 0.6);
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.4), inset 0 0 30px rgba(255, 105, 180, 0.1);
            padding: 35px 30px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* Переключатель языка */
        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }

        .lang-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,105,180,0.3);
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
        }

        .lang-btn.active {
            background: #ff69b4;
            border-color: #ff69b4;
        }

        .lang-btn:hover {
            background: #ff69b4;
            transform: scale(1.05);
        }

        .avatar-section {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
        }

        .avatar-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ff69b4;
            opacity: 0.6;
            animation: pulse 2s infinite;
            z-index: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .avatar {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff69b4;
            box-shadow: 0 0 30px #ff69b4;
            z-index: 1;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #fff, #ff69b4, #ff99cc, #ff69b4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .nick {
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            color: #ff99cc;
            background: rgba(255, 105, 180, 0.12);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 60px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .nick-wrapper {
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,105,180,0.2);
            border-radius: 50px;
            padding: 5px 16px;
            font-size: 0.75rem;
            margin: 0 5px;
        }

        .bio {
            font-size: 0.95rem;
            color: #eaeaea;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            padding: 12px 18px;
            line-height: 1.5;
            border-left: 2px solid #ff69b4;
            text-align: center;
        }

        .social-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .social-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,105,180,0.3);
            border-radius: 50px;
            padding: 12px 25px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .social-btn:hover {
            background: #ff69b4;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,105,180,0.4);
        }

        .social-btn a {
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,105,180,0.3);
            border-radius: 50px;
            padding: 12px 25px;
            color: white;
            font-weight: 500;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
            justify-content: center;
            margin-top: 5px;
        }

        .info-btn:hover {
            background: #ff69b4;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,105,180,0.4);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            background: linear-gradient(135deg, #1a1a2e, #0d0d1a);
            border-radius: 40px;
            padding: 35px 30px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            border: 2px solid #ff69b4;
            box-shadow: 0 0 50px rgba(255,105,180,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-window {
            transform: scale(1);
        }

        .modal-window h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff69b4, #ff99cc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .modal-info {
            text-align: left;
            margin: 20px 0;
            font-size: 1rem;
            line-height: 2;
        }

        .modal-info i {
            width: 28px;
            color: #ff69b4;
            margin-right: 10px;
        }

        .modal-close {
            background: linear-gradient(135deg, #ff69b4, #ff3388);
            border: none;
            border-radius: 40px;
            padding: 12px 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
            font-size: 1rem;
        }

        .modal-close:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff69b4;
        }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff69b4, #ff3388);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 10001;
            box-shadow: 0 0 20px rgba(255,105,180,0.5);
            animation: toastFade 2s ease forwards;
            pointer-events: none;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        .footer-stuff {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            font-size: 0.7rem;
            color: #ff99cc;
            border-top: 1px dashed rgba(255,105,180,0.3);
            padding-top: 18px;
        }

        @media (max-width: 550px) {
            .epic-card { padding: 25px 20px; }
            .name { font-size: 2rem; }
            .avatar-section { width: 110px; height: 110px; }
            .avatar { width: 110px; height: 110px; }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="overlay"></div>

<div class="main-container">
    <div class="epic-card" id="mainCard">
        <!-- Переключатель языка -->
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="ru">RU</button>
            <button class="lang-btn" data-lang="en">EN</button>
        </div>

        <!-- Аватарка -->
        <div class="avatar-section">
            <div class="avatar-pulse"></div>
            <div class="avatar">
                <img src="https://media.discordapp.net/attachments/1498720837694525580/1503369701840126102/5064BD7E-D3CE-4EAA-824B-103E9FF890CE.png?ex=6a0319a4&is=6a01c824&hm=b0fd716490103bde51d7aec9d4350081b0020b546f97509a1d9e23e2732bff01&=&format=webp&quality=lossless&width=925&height=960" alt="avatar">
            </div>
        </div>

        <!-- Имя и текст с поддержкой двух языков -->
        <div class="name">Паша</div>
        <div class="nick-wrapper">
            <span class="nick">@vestel</span>
        </div>
        <div style="text-align: center; margin-bottom: 20px;">
            <span class="badge">🎂 17 лет</span>
            <span class="badge" id="badgeRole">💀 Sceleton Army</span>
        </div>

        <div class="bio" id="bioText">
            Должности: Sceleton Army - Curator, Support
        </div>

        <!-- Социальные сети -->
        <div class="social-links">
            <div class="social-btn" id="discordBtn">
                <i class="fab fa-discord"></i> <span id="discordText">vest_el</span>
            </div>
            <a href="https://www.roblox.com/users/2370186892/profile" class="social-btn" target="_blank">
                <i class="fas fa-gamepad"></i> <span id="robloxText">Roblox</span>
            </a>
            <a href="https://t.me/vest_ell" class="social-btn" target="_blank">
                <i class="fab fa-telegram"></i> <span id="telegramText">@vest_ell</span>
            </a>
        </div>

        <!-- Кнопка INFO -->
        <div class="info-btn" id="infoBtn">
            <i class="fas fa-info-circle"></i> <span id="infoText">INFO</span>
        </div>

        <!-- Нижняя панель -->
        <div class="footer-stuff">
            <span>🌸 さくら</span>
            <span id="footerQuote">Sceleton Army</span>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО INFO -->
<div class="modal-overlay" id="infoModal">
    <div class="modal-window">
        <h2 id="modalTitle">🌸 INFO</h2>
        <div class="modal-info" id="modalInfo">
            <p><i class="fas fa-user"></i> <strong id="infoNameLabel">Имя:</strong> <span id="infoNameValue">Паша</span></p>
            <p><i class="fas fa-calendar-alt"></i> <strong id="infoAgeLabel">Возраст:</strong> <span id="infoAgeValue">17 лет</span></p>
            <p><i class="fas fa-birthday-cake"></i> <strong id="infoBirthLabel">День рождения:</strong> <span id="infoBirthValue">28 августа</span></p>
            <p><i class="fas fa-city"></i> <strong id="infoCityLabel">Город:</strong> <span id="infoCityValue">Пермь</span></p>
            <p><i class="fas fa-skull"></i> <strong id="infoRoleLabel">Должность:</strong> <span id="infoRoleValue">Sceleton Army - Curator, Support</span></p>
        </div>
        <button class="modal-close" id="closeModalBtn">✨ <span id="closeText">Закрыть</span> ✨</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    (function() {
        // ========== СЛОВАРЬ ДЛЯ ПЕРЕВОДА ==========
        const translations = {
            ru: {
                badgeRole: "💀 Sceleton Army",
                bio: "Должности: Sceleton Army - Curator, Support",
                discordText: "vest_el",
                robloxText: "Roblox",
                telegramText: "@vest_ell",
                infoText: "INFO",
                footerQuote: "Sceleton Army",
                modalTitle: "🌸 INFO",
                infoNameLabel: "Имя:",
                infoAgeLabel: "Возраст:",
                infoBirthLabel: "День рождения:",
                infoCityLabel: "Город:",
                infoRoleLabel: "Должность:",
                closeText: "Закрыть",
                infoNameValue: "Паша",
                infoAgeValue: "17 лет",
                infoBirthValue: "28 августа",
                infoCityValue: "Пермь",
                infoRoleValue: "Sceleton Army - Curator, Support"
            },
            en: {
                badgeRole: "💀 Sceleton Army",
                bio: "Roles: Sceleton Army - Curator, Support",
                discordText: "vest_el",
                robloxText: "Roblox",
                telegramText: "@vest_ell",
                infoText: "INFO",
                footerQuote: "Sceleton Army",
                modalTitle: "🌸 INFO",
                infoNameLabel: "Name:",
                infoAgeLabel: "Age:",
                infoBirthLabel: "Birthday:",
                infoCityLabel: "City:",
                infoRoleLabel: "Role:",
                closeText: "Close",
                infoNameValue: "Pasha",
                infoAgeValue: "17 years old",
                infoBirthValue: "August 28",
                infoCityValue: "Perm",
                infoRoleValue: "Sceleton Army - Curator, Support"
            }
        };

        let currentLang = 'ru';

        function updateLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('badgeRole').innerHTML = t.badgeRole;
            document.getElementById('bioText').innerHTML = t.bio;
            document.getElementById('discordText').innerHTML = t.discordText;
            document.getElementById('robloxText').innerHTML = t.robloxText;
            document.getElementById('telegramText').innerHTML = t.telegramText;
            document.getElementById('infoText').innerHTML = t.infoText;
            document.getElementById('footerQuote').innerHTML = t.footerQuote;
            document.getElementById('modalTitle').innerHTML = t.modalTitle;
            document.getElementById('infoNameLabel').innerHTML = t.infoNameLabel;
            document.getElementById('infoAgeLabel').innerHTML = t.infoAgeLabel;
            document.getElementById('infoBirthLabel').innerHTML = t.infoBirthLabel;
            document.getElementById('infoCityLabel').innerHTML = t.infoCityLabel;
            document.getElementById('infoRoleLabel').innerHTML = t.infoRoleLabel;
            document.getElementById('closeText').innerHTML = t.closeText;
            document.getElementById('infoNameValue').innerHTML = t.infoNameValue;
            document.getElementById('infoAgeValue').innerHTML = t.infoAgeValue;
            document.getElementById('infoBirthValue').innerHTML = t.infoBirthValue;
            document.getElementById('infoCityValue').innerHTML = t.infoCityValue;
            document.getElementById('infoRoleValue').innerHTML = t.infoRoleValue;
            
            // Обновляем активную кнопку
            document.querySelectorAll('.lang-btn').forEach(btn => {
                if(btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Обработчики переключения языка
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.getAttribute('data-lang');
                updateLanguage(lang);
            });
        });

        // ========== МОДАЛЬНОЕ ОКНО ==========
        const modal = document.getElementById('infoModal');
        const infoBtn = document.getElementById('infoBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        function openModal() {
            modal.classList.add('active');
        }
        
        function closeModal() {
            modal.classList.remove('active');
        }
        
        if(infoBtn) infoBtn.addEventListener('click', openModal);
        if(closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
        
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });
        
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        // ========== УВЕДОМЛЕНИЕ ==========
        function showToast(message) {
            const existingToast = document.querySelector('.toast-notification');
            if(existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                if(toast && toast.remove) toast.remove();
            }, 2000);
        }

        // ========== КОПИРОВАНИЕ DISCORD ==========
        const discordBtn = document.getElementById('discordBtn');
        if(discordBtn) {
            discordBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const discordNick = 'vest_el';
                try {
                    await navigator.clipboard.writeText(discordNick);
                    showToast('✅ Discord скопирован: ' + discordNick);
                    discordBtn.style.transform = 'scale(0.95)';
                    setTimeout(() => { discordBtn.style.transform = ''; }, 150);
                } catch (err) {
                    showToast('❌ Не удалось скопировать');
                }
            });
        }

        // ========== КАСТОМНЫЙ КУРСОР САКУРА ==========
        const cursor = document.createElement('div');
        cursor.className = 'custom-cursor';
        cursor.innerHTML = '🌸';
        document.body.appendChild(cursor);
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            
            // Эффект изменения размера на кнопках
            const target = e.target.closest('.social-btn, .info-btn, .lang-btn, .modal-close');
            if(target) {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.3)';
                cursor.style.filter = 'drop-shadow(0 0 8px #ff69b4)';
            } else {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursor.style.filter = 'drop-shadow(0 0 4px #ff69b4)';
            }
        });
        
        // Скрываем курсор при уходе с окна
        document.addEventListener('mouseleave', () => {
            cursor.style.opacity = '0';
        });
        document.addEventListener('mouseenter', () => {
            cursor.style.opacity = '1';
        });

        // ========== 3D ФОН ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 35);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount; i++) {
            posArray[i*3] = (Math.random() - 0.5) * 200;
            posArray[i*3+1] = (Math.random() - 0.5) * 120;
            posArray[i*3+2] = (Math.random() - 0.5) * 100 - 30;
        }
        const particlesGeo = new THREE.BufferGeometry();
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ color: 0xff69b4, size: 0.18, transparent: true, opacity: 0.5 });
        const particleSystem = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particleSystem);
        
        const ringGeo = new THREE.TorusGeometry(6, 0.12, 64, 300);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xff69b4, emissive: 0xff3388, emissiveIntensity: 0.6 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        scene.add(ring);
        
        const ring2Geo = new THREE.TorusGeometry(8, 0.08, 64, 300);
        const ring2 = new THREE.Mesh(ring2Geo, ringMat);
        scene.add(ring2);
        
        const sphereGroup = new THREE.Group();
        for(let i = 0; i < 50; i++) {
            const sphereGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff88bb, emissive: 0xff3388 });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            const angle = (i / 50) * Math.PI * 2;
            const rad = 5;
            sphere.position.set(Math.cos(angle) * rad, Math.sin(angle * 2) * 1.5, Math.sin(angle) * rad);
            sphereGroup.add(sphere);
        }
        scene.add(sphereGroup);
        
        const light1 = new THREE.PointLight(0xff69b4, 0.8);
        light1.position.set(5, 5, 10);
        scene.add(light1);
        const ambient = new THREE.AmbientLight(0x222222);
        scene.add(ambient);
        
        let time = 0;
        function animateBackground() {
            requestAnimationFrame(animateBackground);
            time += 0.008;
            particleSystem.rotation.y = time * 0.1;
            particleSystem.rotation.x = Math.sin(time * 0.2) * 0.1;
            ring.rotation.x = time * 0.3;
            ring.rotation.z = time * 0.2;
            ring2.rotation.y = time * 0.5;
            ring2.rotation.x = time * 0.2;
            sphereGroup.rotation.y = time * 0.2;
            sphereGroup.rotation.x = Math.sin(time * 0.5) * 0.2;
            
            camera.position.x = Math.sin(time * 0.2) * 1;
            camera.position.y = Math.cos(time * 0.25) * 0.8;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        animateBackground();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ========== ПАДАЮЩАЯ САКУРА ==========
        const sakuraSymbols = ['🌸', '🌸', '💮', '🌸', '🌸', '✿', '❀', '🌸'];
        function createSakura() {
            const petal = document.createElement('div');
            petal.innerHTML = sakuraSymbols[Math.floor(Math.random() * sakuraSymbols.length)];
            petal.style.position = 'fixed';
            petal.style.pointerEvents = 'none';
            petal.style.zIndex = '9999';
            petal.style.fontSize = (18 + Math.random() * 20) + 'px';
            petal.style.left = Math.random() * 100 + '%';
            petal.style.top = '-50px';
            petal.style.opacity = 0.7;
            petal.style.animation = `fall ${5 + Math.random() * 6}s linear forwards`;
            document.body.appendChild(petal);
            petal.addEventListener('animationend', () => petal.remove());
        }
        const style = document.createElement('style');
        style.textContent = `@keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }`;
        document.head.appendChild(style);
        
        for(let i=0;i<12;i++) setTimeout(createSakura, i * 150);
        setInterval(() => {
            const count = Math.random() > 0.7 ? 2 : 1;
            for(let i = 0; i < count; i++) {
                setTimeout(createSakura, i * 100);
            }
        }, 2500);
        
        // ========== ПАРАЛЛАКС ==========
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            document.getElementById('mainCard').style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
        });
    })();
</script>
</body>
</html>
